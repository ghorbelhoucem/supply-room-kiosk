<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Supply Room — Check-Out Station</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=IBM+Plex+Mono:wght@500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#1c1e22;
    --panel:#24272c;
    --panel-alt:#2b2f35;
    --border:#3a3f45;
    --accent:#ff7a1a;
    --accent-hover:#ff9142;
    --accent-dim:#7a3d18;
    --success:#4caf6d;
    --danger:#e5484d;
    --text:#f2f0ea;
    --text-dim:#9aa0a6;
    --tag-bg:#111214;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:#1c1e22;color:var(--text);font-family:'Inter',system-ui,sans-serif;height:100%;
    background-image:radial-gradient(circle, rgba(255,255,255,0.035) 1px, transparent 1px);
    background-size:22px 22px;}
  .app{max-width:min(1200px,94vw);margin:0 auto;padding:28px clamp(16px,3vw,40px) 40px;min-height:100vh;box-sizing:border-box;}
  .topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px;}
  .brand{display:flex;align-items:center;gap:12px;}
  .brand-mark{width:34px;height:34px;border-radius:7px;background:#f2f0ea;display:flex;align-items:center;justify-content:center;flex-shrink:0;box-shadow:0 3px 10px rgba(0,0,0,0.25);padding:5px;box-sizing:border-box;}
  .brand-mark img{width:100%;height:100%;object-fit:contain;}
  .brand-text{display:flex;flex-direction:column;justify-content:center;line-height:1.2;}
  .btn-ghost{background:transparent;color:var(--text-dim);border:1px solid var(--border);font-family:'Inter',sans-serif;font-size:11.5px;padding:7px 15px;border-radius:4px;cursor:pointer;transition:all .15s ease;}
  .btn-ghost:hover{color:var(--text);border-color:var(--accent);}
  input:focus, select:focus{outline:none;border-color:var(--accent) !important;box-shadow:0 0 0 3px rgba(255,122,26,0.15);}
  .brand h1{font-family:'Oswald',sans-serif;font-weight:700;letter-spacing:0.06em;font-size:22px;margin:0;text-transform:uppercase;}
  .brand span{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--text-dim);letter-spacing:0.08em;}
  .topbar-right{display:flex;align-items:center;gap:14px;}
  .clock{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--text-dim);letter-spacing:0.05em;text-align:right;line-height:1.4;}
  .status-dot{display:inline-flex;align-items:center;gap:6px;font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--text-dim);letter-spacing:0.05em;}
  .status-dot .dot{width:7px;height:7px;border-radius:50%;background:var(--success);box-shadow:0 0 6px var(--success);}
  .status-dot.offline .dot{background:var(--danger);box-shadow:0 0 6px var(--danger);}
  .nav-btn{background:var(--panel);border:1px solid var(--border);color:var(--text-dim);font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:0.05em;padding:8px 14px;border-radius:3px;cursor:pointer;text-transform:uppercase;transition:all .15s ease;}
  .nav-btn:hover{color:var(--text);border-color:var(--accent);}
  .nav-btn.active{background:var(--accent);color:#1c1e22;border-color:var(--accent);}
  .stage{background:transparent;border:none;padding:32px 0;min-height:calc(100vh - 150px);position:relative;overflow:hidden;display:flex;flex-direction:column;justify-content:center;}
  .reader-wrap{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;padding:20px 0 6px;text-align:center;}
  .slot{width:280px;height:80px;border:2px dashed var(--border);border-radius:8px;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;background:var(--panel-alt);}
  .hint{color:var(--text-dim);font-size:13px;margin-top:16px;font-family:'Inter',sans-serif;}
  .go-btn{margin-top:22px;background:var(--accent);color:#1c1e22;border:none;font-family:'Oswald',sans-serif;font-weight:600;text-transform:uppercase;letter-spacing:0.05em;font-size:14px;padding:12px 30px;border-radius:4px;cursor:pointer;transition:background .15s ease;}
  .go-btn:hover{background:var(--accent-hover);}
  .go-btn:disabled{background:var(--panel-alt);color:var(--text-dim);cursor:not-allowed;}
  .greet{text-align:center;margin-bottom:24px;}
  .greet .name{font-family:'Oswald',sans-serif;font-size:26px;font-weight:600;text-transform:uppercase;letter-spacing:0.03em;}
  .greet .code{font-family:'IBM Plex Mono',monospace;color:var(--accent);font-size:13px;letter-spacing:0.1em;}
  .menu-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;max-width:520px;margin:0 auto;}
  .menu-card{background:var(--panel-alt);border:1px solid var(--border);border-radius:6px;padding:22px 16px;text-align:center;cursor:pointer;transition:all .18s ease;}
  .menu-card:hover{border-color:var(--accent);transform:translateY(-3px);box-shadow:0 8px 20px rgba(0,0,0,0.35);}
  .menu-card:active{transform:translateY(-1px);}
  .menu-card .big{font-size:28px;margin-bottom:8px;}
  .menu-card .label{font-family:'Oswald',sans-serif;font-weight:600;text-transform:uppercase;letter-spacing:0.04em;font-size:14px;}
  .menu-card .sub{color:var(--text-dim);font-size:12px;margin-top:4px;}
  .menu-card.disabled{opacity:0.4;cursor:not-allowed;}
  .menu-card.disabled:hover{transform:none;border-color:var(--border);}
  .open-list{max-width:100%;margin:22px auto 0;}
  .open-list h3{font-family:'Oswald',sans-serif;font-size:13px;text-transform:uppercase;letter-spacing:0.06em;color:var(--text-dim);margin:0 0 8px;}
  .open-row{display:flex;align-items:center;justify-content:space-between;background:var(--panel-alt);border:1px solid var(--border);border-radius:4px;padding:10px 14px;margin-bottom:6px;font-size:13px;}
  .open-row.overdue{border-color:var(--danger);}
  .open-row .due{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--text-dim);}
  .open-row.overdue .due{color:var(--danger);}
  .tag{display:inline-block;background:var(--tag-bg);border:1px solid #000;border-radius:2px;padding:2px 8px;font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:0.06em;color:#e8e6e1;}
  .item-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:8px;max-width:100%;margin:18px auto 0;max-height:clamp(320px,52vh,700px);overflow-y:auto;padding-right:4px;}
  .item-list>.empty-note{grid-column:1/-1;}
  .item-row{display:flex;align-items:center;justify-content:space-between;background:var(--panel-alt);border:1px solid var(--border);border-radius:5px;padding:12px 16px;cursor:pointer;transition:border-color .15s ease;}
  .item-row:hover{border-color:var(--accent);}
  .item-row.selected{border-color:var(--accent);background:rgba(255,122,26,0.08);}
  .item-name{font-weight:600;font-size:14px;}
  .item-meta{color:var(--text-dim);font-size:12px;margin-top:2px;}
  .stock{font-family:'IBM Plex Mono',monospace;font-size:13px;}
  .stock.low{color:var(--danger);}
  .back-link{color:var(--text-dim);font-size:12px;cursor:pointer;display:inline-block;margin-bottom:14px;}
  .back-link:hover{color:var(--text);}
  .form-row{max-width:min(600px,100%);margin:20px auto 0;}
  .form-row label{display:block;font-size:12px;color:var(--text-dim);margin-bottom:6px;text-transform:uppercase;letter-spacing:0.05em;}
  .form-row input,.form-row select{width:100%;background:var(--panel-alt);border:1px solid var(--border);color:var(--text);padding:10px 12px;border-radius:4px;font-family:'IBM Plex Mono',monospace;font-size:14px;margin-bottom:14px;}
  .confirm-box{text-align:center;padding:40px 0;}
  .confirm-box .icon{font-size:42px;margin-bottom:10px;}
  .confirm-box .msg{font-family:'Oswald',sans-serif;font-size:18px;text-transform:uppercase;letter-spacing:0.03em;}
  .confirm-box .detail{color:var(--text-dim);font-size:13px;margin-top:8px;}
  .report-tabs{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap;}
  table{width:100%;border-collapse:collapse;font-size:12.5px;border:1px solid var(--border);border-radius:6px;overflow:hidden;}
  th{text-align:left;color:var(--text-dim);font-weight:600;text-transform:uppercase;letter-spacing:0.04em;font-size:10.5px;padding:10px;background:var(--panel-alt);border-bottom:1px solid var(--border);}
  td{padding:9px 10px;border-bottom:1px solid var(--border);}
  tbody tr:nth-child(even){background:rgba(255,255,255,0.02);}
  tbody tr:hover{background:rgba(255,122,26,0.05);}
  tr.overdue td{color:var(--danger);}
  .pill{font-family:'IBM Plex Mono',monospace;font-size:10.5px;padding:2px 7px;border-radius:10px;border:1px solid var(--border);}
  .pill.open{color:var(--accent);border-color:var(--accent-dim);}
  .pill.done{color:var(--success);border-color:#255c37;}
  .pill.over{color:var(--danger);border-color:#5c2527;}
  .stockbar{background:var(--panel-alt);border:1px solid var(--border);border-radius:5px;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;}
  .empty-note{color:var(--text-dim);text-align:center;padding:30px 0;font-size:13px;}
  .error-msg{color:var(--danger);font-size:12.5px;margin:-8px 0 12px;}
  .confirm-panel{max-width:420px;margin:24px auto 0;background:var(--panel-alt);border:1px solid var(--border);border-radius:6px;padding:20px;}
  .confirm-panel .q{font-size:14px;margin-bottom:16px;}
  .confirm-actions{display:flex;gap:10px;}
  .confirm-actions button{flex:1;padding:10px;border-radius:4px;border:1px solid var(--border);cursor:pointer;font-family:'Oswald',sans-serif;font-weight:600;text-transform:uppercase;font-size:13px;letter-spacing:0.03em;}
  .confirm-actions .yes{background:var(--accent);color:#1c1e22;border-color:var(--accent);}
  .confirm-actions .no{background:transparent;color:var(--text-dim);}
  .loading-wrap{display:flex;align-items:center;justify-content:center;height:100%;min-height:340px;color:var(--text-dim);font-family:'IBM Plex Mono',monospace;font-size:13px;letter-spacing:0.05em;}
  .banner-error{background:#3a1f1f;border:1px solid var(--danger);color:#f2b9b9;border-radius:5px;padding:10px 14px;font-size:12.5px;margin-bottom:16px;}

  /* === kiosk UX improvements === */
  html,body{-webkit-tap-highlight-color:transparent;touch-action:manipulation;}
  button,.menu-card,.item-row{touch-action:manipulation;}

  /* Larger, more tappable role cards */
  .menu-card{padding:28px 18px;min-height:120px;}
  .menu-card .big{font-size:36px;margin-bottom:10px;}
  .menu-card .label{font-size:15px;}
  .menu-card:active{transform:scale(0.97) !important;}

  /* Bigger touch targets throughout */
  .go-btn{padding:15px 36px;font-size:15px;border-radius:5px;}
  .go-btn:active{transform:scale(0.97);}
  .btn-ghost{padding:11px 20px;font-size:12.5px;border-radius:5px;}
  .item-row{min-height:66px;padding:14px 16px;}
  .item-name{font-size:15px;}
  .nav-btn{padding:10px 16px;}

  /* Animated loading spinner */
  .spin-ring{width:36px;height:36px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:kiosk-spin .72s linear infinite;margin:0 auto 14px;}
  @keyframes kiosk-spin{to{transform:rotate(360deg);}}

  /* On-screen numpad for PIN / operator ID */
  .numpad-wrap{max-width:290px;margin:0 auto;}
  .numpad-display{font-family:'IBM Plex Mono',monospace;font-size:30px;letter-spacing:.4em;text-align:center;padding:14px 20px;background:var(--panel-alt);border:2px solid var(--border);border-radius:7px;min-height:64px;display:flex;align-items:center;justify-content:center;margin-bottom:14px;transition:border-color .15s,box-shadow .15s;}
  .numpad-display.active{border-color:var(--accent);box-shadow:0 0 0 3px rgba(255,122,26,.12);}
  .numpad-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
  .numpad-key{height:66px;background:var(--panel-alt);border:1px solid var(--border);color:var(--text);font-family:'IBM Plex Mono',monospace;font-size:22px;font-weight:600;border-radius:7px;cursor:pointer;transition:background .1s,transform .08s,border-color .1s;display:flex;align-items:center;justify-content:center;-webkit-user-select:none;user-select:none;}
  .numpad-key:hover{background:var(--panel);border-color:var(--accent-dim);}
  .numpad-key:active{transform:scale(0.91);background:rgba(255,122,26,.14);}
  .numpad-key.del{color:var(--text-dim);font-size:19px;}
  .numpad-key.del:hover{border-color:var(--danger);color:var(--danger);}
  .numpad-key.go{background:var(--accent);color:#1c1e22;border-color:var(--accent);font-family:'Oswald',sans-serif;font-size:14px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;}
  .numpad-key.go:hover{background:var(--accent-hover);}
  .numpad-key.go:disabled{background:var(--panel-alt);color:var(--text-dim);border-color:var(--border);cursor:not-allowed;transform:none;}
  .numpad-key.go:active:not(:disabled){transform:scale(0.95);}

  /* Pulsing scan icon */
  @keyframes scan-pulse{0%,100%{opacity:1;transform:scale(1);}50%{opacity:.6;transform:scale(1.1);}}
  .scan-pulse{display:inline-block;animation:scan-pulse 2s ease-in-out infinite;}

  /* Pop-in animation on confirmation */
  @keyframes pop-in{0%{transform:scale(.3) rotate(-15deg);opacity:0;}65%{transform:scale(1.18) rotate(4deg);}100%{transform:scale(1) rotate(0deg);opacity:1;}}
  .confirm-pop{display:inline-block;animation:pop-in .45s cubic-bezier(.34,1.56,.64,1) both;}
</style>
</head>
<body>

<div class="app" id="app"></div>

<script src="./src/api/client.js"></script>
<script src="./src/domain/inventory.js"></script>
<script src="./src/state/machine.js"></script>
<script src="./src/state/store.js"></script>
<script src="./src/scanner/keyboardScanner.js"></script>
<script src="./src/ui/renderer.js"></script>
<script>
(function(){
  // ==== your Apps Script Web App URL ====
  const WEBAPP_URL = 'https://script.google.com/macros/s/AKfycbxk6CIrk9GI1zn82Yg-5ZI3E8WOTVG02TgYDY-yqgV6isWkDKJR-n8rnhfJZ4jSOGqLAQ/exec';
  const apiClient = window.SupplyApi.createApiClient(WEBAPP_URL, { timeoutMs: 9000, retries: 2 });
  const domain = window.SupplyDomain;
  const { upgradeInteractiveElements, setButtonBusy } = window.SupplyUi;
  const machine = window.SupplyMachine.createSupplyMachine();
  const store = window.SupplyStore.createStore(machine, { current: 'idle' });

  const ICONS = { 'Tools': '🧰', 'Station Parts': '🔌' };

  const ROLES = {
    maintenance: { label: 'Maintenance', sub: 'Repairs & upkeep', icon: '🔧', kind: 'pin' },
    management:  { label: 'Management', sub: 'Oversight & reporting', icon: '📋', kind: 'pin' },
    supervisor:  { label: 'Supervisor', sub: 'Floor supervision', icon: '🧭', kind: 'operatorId' },
    teleoperator:{ label: 'Tele-operator', sub: 'Remote operation', icon: '🎮', kind: 'operatorId' },
    devs:        { label: 'Devs', sub: 'Development & testing', icon: '💻', kind: 'pin' }
  };

  // ==== Per-person PINs — change any of these codes any time ====
  // "unique" PINs identify one specific person directly, no name pick needed.
  // "sharedPin" is a fallback code shared by everyone listed in sharedNames —
  // entering it asks a quick "which one of you?" since the PIN alone can't tell.
  const PIN_DIRECTORY = {
    maintenance: {
      unique: { '4708':'Houcem', '4191':'Marwan', '4719':'Hamza' },
      sharedPin: '0000',
      sharedNames: ['Ahmed','Felix','Yie Hang']
    },
    management: {
      unique: { '4685':'Rosa', '4728':'Clarissa' },
      sharedPin: '0000',
      sharedNames: ['Bingie','Winnie']
    },
    devs: {
      unique: {},
      sharedPin: '7346',   // change this to whatever you want the devs code to be
      sharedNames: ['Developer']
    }
  };

  let screen = 'idle'; // idle, deptPin, deptPinPickName, operatorId, menu, takeCategory, take, return, confirm, report
  let pendingRole = null;
  let pendingName = null;
  let pendingSharedNames = null;
  let pinError = null;
  let pendingOperatorId = null;
  let operatorIdError = null;
  let operatorPasswordError = null;
  let currentPerson = null; // {name, role, code}  code = "Name/Role"
  let takeCategory = null; // 'Tools' | 'Station Parts'
  let takeSelection = null; // {itemName, qty, hours}
  let takeSearchQuery = '';
  let takeError = null;
  let pendingReturnTx = null;
  let returnScanError = null;
  let returnFirstError = null;
  let pendingReturnMatches = null;
  let confirmInfo = null;
  let reportTab = 'open';
  let reportReturnScreen = 'idle'; // where the report back-button goes
  let basket = [];
  let basketIdCounter = 0;
  let scanBuffer = '';
  let lastScanKeyTime = 0;
  let scanNotice = null;
  let pendingScanItem = null;
  let scanNotFoundError = null;

  let inventoryMap = {}; // itemName -> {reference, item, quantity, availability}
  let historyRows = [];  // [{timestamp, personRole, item, expectedReturn, returnedAt, txId}]
  let loadError = null;

  function setScreen(next){
    if(screen === next) return true;
    const result = store.transition(next);
    if(!result.ok){
      console.warn(result.error);
      return false;
    }
    screen = next;
    return true;
  }

  function esc(s){ return String(s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

  function iconForRef(reference){ return ICONS[reference] || '📦'; }

  const ITEM_ICON_EXACT = { 'pc': '🖥️' };
  const ITEM_ICON_KEYWORDS = [
    ['camera','📷'], ['monitor','🖥️'], ['screen','🖥️'], ['keyboard','⌨️'], ['mouse','🖱️'],
    ['antenna','📡'], ['wifi','📡'], ['adapter','🔌'], ['cable','🔌'], ['power','⚡'],
    ['socket','🔌'], ['light','💡'], ['gripper','🦾'], ['arm','🦾'], ['box','📦'],
    ['screw','🔩'], ['zip tie','🔗'], ['button','🛑'], ['touchpad','🔌']
  ];

  function iconForItem(itemName){
    const inv = inventoryMap[itemName];
    const fallback = inv ? iconForRef(inv.reference) : '📦';
    const lower = String(itemName).toLowerCase().trim();
    if(ITEM_ICON_EXACT[lower]) return ITEM_ICON_EXACT[lower];
    for(const [kw, icon] of ITEM_ICON_KEYWORDS){
      if(lower.includes(kw)) return icon;
    }
    return fallback;
  }

  // Real photos for items we have pictures of — everything else falls back
  // to the emoji icon above. Put the actual image files in an "images/"
  // folder next to index.html on GitHub for these to show up.
  const PHOTO_MAP = {
    'Mouse': 'images/mouse.jpg',
    'Wrist Camera Cable': 'images/wrist_camera_cable.jpg',
    'Environmental Camera Cable': 'images/environmental_camera_cable.jpg',
    'USB-C Cable (Head Camera)': 'images/usb_c_cable_head_camera.jpg',
    'Type C-C Cable': 'images/type_c_c_cable.jpg',
    'Ethernet Cable 0.5M': 'images/ethernet_cable.jpg',
    'Ethernet Cable 1M': 'images/ethernet_cable.jpg',
    'Ethernet Cable 2M': 'images/ethernet_cable.jpg',
    'Ethernet Cable 3M': 'images/ethernet_cable.jpg',
    'Ethernet Cable 5M': 'images/ethernet_cable.jpg',
    'Ethernet Cable 10M': 'images/ethernet_cable.jpg',
    'Arm Power Cable': 'images/arm_power_cable.jpg',
    'Station Monitor Touchpad Cable': 'images/touchpad_cable.jpg',
    'DP Monitor Cable': 'images/dp_monitor_cable.jpg',
    'Keyboard': 'images/keyboard.jpg',
    'Gripper Power Supply': 'images/power_supply.jpg',
    'Switch Power Supply': 'images/power_supply.jpg',
    'Type C to Ethernet': 'images/type_c_to_ethernet.jpg',
    'Power Cable (PC/Monitor)': 'images/power_cable_pc_monitor.jpg',
    'HDMI Cable': 'images/hdmi_cable.jpg',
    'Ethernet Adapter': 'images/ethernet_adapter.jpg',
    'Emergency Button': 'images/emergency_button.jpg',
    'Space Mouse': 'images/space_mouse.jpg',
    'Wifi Antenna': 'images/wifi_antenna.jpg',
    'USB Hub': 'images/usb_hub.jpg',
    'Power Socket': 'images/power_socket.jpg'
  };

  // Renders a small photo thumbnail if we have one for this item, otherwise
  // falls back to the emoji icon — used everywhere an item is shown.
  function itemThumbHTML(itemName, sizePx){
    sizePx = sizePx || 30;
    const photo = PHOTO_MAP[itemName];
    const fallbackIcon = iconForItem(itemName);
    if(photo){
      return `<img src="${photo}" alt="" style="width:${sizePx}px;height:${sizePx}px;object-fit:cover;border-radius:4px;vertical-align:middle;border:1px solid var(--border);background:#fff;" onerror="this.outerHTML='<span style=\\'font-size:${Math.round(sizePx*0.72)}px;vertical-align:middle;\\'>${fallbackIcon}</span>'">`;
    }
    return `<span style="font-size:${Math.round(sizePx*0.72)}px;vertical-align:middle;">${fallbackIcon}</span>`;
  }

  let lastFetchTime = 0;

  async function refreshRemote(){
    const result = await apiClient.loadInventory();
    if(result.ok){
      inventoryMap = {};
      (result.inventory||[]).forEach(row=>{ inventoryMap[row.item] = row; });
      historyRows = result.history || [];
      loadError = null;
      lastFetchTime = Date.now();
    } else {
      loadError = result.error || 'Could not reach the inventory sheet. Check your internet connection and try again.';
    }
    updateStatusDot();
  }

  // Skips the network round-trip if we fetched very recently — avoids a
  // visible loading spinner when moving quickly between screens right
  // after data was already refreshed (e.g. right after signing in).
  async function refreshRemoteIfStale(maxAgeMs){
    if(Date.now() - lastFetchTime < maxAgeMs) return;
    await refreshRemote();
  }

  function updateStatusDot(){
    const el = document.getElementById('statusDot');
    if(!el) return;

  function updateClock(){

    const timeStr = now.toLocaleTimeString(undefined,{hour:'2-digit',minute:'2-digit'});
    el.innerHTML = `${dateStr}<br>${timeStr}`;
  }

  async function withLoading(fn){
    const stage = document.getElementById('stage');
    if(stage) renderLoading(stage);
    await fn();

  function renderStage(){
    const stage = document.getElementById('stage');
    stage.style.opacity = '0';
    let banner = '';
    if(loadError) banner = `<div class="banner-error">${esc(loadError)}</div>`;
    if(screen==='idle') stageRoleSelect(stage, banner);
    else if(screen==='deptPin') stageDeptPin(stage, banner);
    else if(screen==='deptPinPickName') stageDeptPinPickName(stage, banner);
    else if(screen==='operatorId') stageOperatorId(stage, banner);
    else if(screen==='operatorPassword') stageOperatorPassword(stage, banner);
    else if(screen==='menu') stageMenu(stage, banner);
    else if(screen==='scanPrompt') stageScanPrompt(stage, banner);
    else if(screen==='scanConfirm') stageScanConfirm(stage, banner);
    else if(screen==='scanTakeDetail') stageScanTakeDetail(stage, banner);
    else if(screen==='basketReview') stageBasketReview(stage, banner);
    else if(screen==='takeCategory') stageTakeCategory(stage, banner);
    else if(screen==='take') stageTake(stage, banner);
    else if(screen==='return') stageReturn(stage, banner);
    else if(screen==='returnScanPrompt') stageReturnScanPrompt(stage, banner);
    else if(screen==='returnBasketReview') stageReturnBasketReview(stage, banner);
    else if(screen==='confirm') stageConfirm(stage, banner);
    else if(screen==='report') stageReport(stage, banner);
    updateReportBtn();
    requestAnimationFrame(()=>requestAnimationFrame(()=>{ stage.style.opacity='1'; stage.style.transition='opacity .13s ease'; }));
  }

  function stageDeptPin(stage, banner){
    const role = ROLES[pendingRole];
    let pin = '';
    const maxLen = 4;

    function numpadUpdate(){
      const display = document.getElementById('numpadDisplay');
      if(!display) return;
      display.textContent = Array.from({length:maxLen},(_,i)=> i<pin.length ? '●' : '○').join(' ');
      display.classList.toggle('active', pin.length > 0);
      const goKey = document.getElementById('numpadGo');
      if(goKey) goKey.disabled = pin.length < maxLen;
    }

    stage.innerHTML = banner + `
      <span class="back-link" id="back">&larr; Back</span>
      <div class="reader-wrap" style="padding-top:6px;">
        <div class="hint" style="margin-top:0;margin-bottom:18px;">${role.icon} ${esc(role.label)} — enter your PIN</div>
        ${pinError ? `<div class="error-msg" style="margin-top:0;margin-bottom:14px;">${esc(pinError)}</div>` : ''}
        <div class="numpad-wrap">
          <div class="numpad-display" id="numpadDisplay">○ ○ ○ ○</div>
          <div class="numpad-grid">
            ${[1,2,3,4,5,6,7,8,9].map(n=>`<button class="numpad-key" data-digit="${n}">${n}</button>`).join('')}
            <button class="numpad-key del" id="numpadDel">⌫</button>
            <button class="numpad-key" data-digit="0">0</button>
            <button class="numpad-key go" id="numpadGo" disabled>Sign In</button>
          </div>
        </div>
      </div>
    `;

    document.getElementById('back').onclick = ()=>{ pendingRole=null; pinError=null; screen='idle'; renderStage(); };

    const submit = async ()=>{
      if(pin.length < maxLen) return;
      const dir = PIN_DIRECTORY[pendingRole];
      const uniqueName = dir.unique[pin];
      if(uniqueName){
        currentPerson = { name: uniqueName, role: role.label, code: uniqueName + '/' + role.label };
        pendingRole = null;
        pinError = null;
        screen = 'menu';
        await withLoading(()=>refreshRemoteIfStale(4000));
        renderStage();
        return;
      }
      if(dir.sharedPin && pin === dir.sharedPin){
        if(dir.sharedNames.length === 1){
          const only = dir.sharedNames[0];
          currentPerson = { name: only, role: role.label, code: only + '/' + role.label };
          pendingRole = null;
          pinError = null;
          screen = 'menu';
          await withLoading(()=>refreshRemoteIfStale(4000));
          renderStage();
          return;
        }
        pendingSharedNames = dir.sharedNames;
        pinError = null;
        screen = 'deptPinPickName';
        renderStage();
        return;
      }
      pinError = 'Incorrect PIN, try again.';
      pin = '';
      renderStage();
    };

    stage.querySelectorAll('[data-digit]').forEach(btn=>{
      btn.onclick = ()=>{ if(pin.length<maxLen){ pin+=btn.getAttribute('data-digit'); numpadUpdate(); } };
    });
    document.getElementById('numpadDel').onclick = ()=>{ pin=pin.slice(0,-1); numpadUpdate(); };
    document.getElementById('numpadGo').onclick = submit;

    function handleKey(e){
      if(!document.getElementById('numpadDisplay')){ document.removeEventListener('keydown', handleKey); return; }
      if(e.key>='0'&&e.key<='9'){ if(pin.length<maxLen){ pin+=e.key; numpadUpdate(); } }
      else if(e.key==='Backspace'){ e.preventDefault(); pin=pin.slice(0,-1); numpadUpdate(); }
      else if(e.key==='Enter'){ submit(); }
    }
    document.addEventListener('keydown', handleKey);
  }

  function stageOperatorId(stage, banner){
    const role = ROLES[pendingRole];
    let digits = '';
    const maxLen = 3;

    function numpadUpdate(){
      const display = document.getElementById('numpadDisplay');
      if(!display) return;
      display.textContent = digits || '—';
      display.classList.toggle('active', digits.length > 0);
      const goKey = document.getElementById('numpadGo');
      if(goKey) goKey.disabled = digits.length < 1;
    }

    stage.innerHTML = banner + `
      <span class="back-link" id="back">&larr; Back</span>
      <div class="reader-wrap" style="padding-top:6px;">
        <div class="hint" style="margin-top:0;margin-bottom:18px;">${role.icon} ${esc(role.label)} — enter your operator ID</div>
        ${operatorIdError ? `<div class="error-msg" style="margin-top:0;margin-bottom:14px;">${esc(operatorIdError)}</div>` : ''}
        <div class="numpad-wrap">
          <div class="numpad-display" id="numpadDisplay" style="font-size:26px;letter-spacing:.2em;">—</div>
          <div class="numpad-grid">
            ${[1,2,3,4,5,6,7,8,9].map(n=>`<button class="numpad-key" data-digit="${n}">${n}</button>`).join('')}
            <button class="numpad-key del" id="numpadDel">⌫</button>
            <button class="numpad-key" data-digit="0">0</button>
            <button class="numpad-key go" id="numpadGo" disabled>Next</button>
          </div>
        </div>
      </div>
    `;

    document.getElementById('back').onclick = ()=>{ pendingRole=null; operatorIdError=null; screen='idle'; renderStage(); };

    const submit = ()=>{
      if(!digits) return;
      const idNum = String(parseInt(digits, 10)); // normalize '007' -> '7' to match stored keys
      if(!OPERATOR_CREDENTIALS.hasOwnProperty(idNum)){
        operatorIdError = 'Unknown operator ID. Check the number and try again.';
        digits = '';
        renderStage();
        return;
      }
      pendingOperatorId = idNum;
      operatorIdError = null;
      screen = 'operatorPassword';
      renderStage();
    };

    stage.querySelectorAll('[data-digit]').forEach(btn=>{
      btn.onclick = ()=>{ if(digits.length<maxLen){ digits+=btn.getAttribute('data-digit'); numpadUpdate(); } };
    });
    document.getElementById('numpadDel').onclick = ()=>{ digits=digits.slice(0,-1); numpadUpdate(); };
    document.getElementById('numpadGo').onclick = submit;

    function handleKey(e){
      if(!document.getElementById('numpadDisplay')){ document.removeEventListener('keydown', handleKey); return; }
      if(e.key>='0'&&e.key<='9'){ if(digits.length<maxLen){ digits+=e.key; numpadUpdate(); } }
      else if(e.key==='Backspace'){ e.preventDefault(); digits=digits.slice(0,-1); numpadUpdate(); }
      else if(e.key==='Enter'){ submit(); }
    }
    document.addEventListener('keydown', handleKey);
  }

  function stageOperatorPassword(stage, banner){
    const role = ROLES[pendingRole];
    const id = pendingOperatorId;
    stage.innerHTML = banner + `
      <span class="back-link" id="back">&larr; Back</span>
      <div class="reader-wrap" style="padding-top:6px;">
        <div class="hint" style="margin-top:0;margin-bottom:18px;">${role.icon} Operator ${esc(id)} — enter your password</div>
        <div class="slot" style="margin-top:0;">
          <input id="opPasswordInput" type="password" placeholder="PASSWORD" autocomplete="off" />
        </div>
        ${operatorPasswordError ? `<div class="error-msg" style="margin-top:14px;">${esc(operatorPasswordError)}</div>` : ''}
        <button class="go-btn" id="opPasswordGo">Sign In</button>
      </div>
    `;
    document.getElementById('back').onclick = ()=>{ pendingOperatorId=null; operatorPasswordError=null; screen='operatorId'; renderStage(); };
    const input = document.getElementById('opPasswordInput');
    input.focus();
    const submit = async ()=>{
      const entered = input.value;
      if(entered !== OPERATOR_CREDENTIALS[id]){
        operatorPasswordError = 'Incorrect password, try again.';
        renderStage();
        return;
      }
      const name = OPERATOR_NAMES[id] || ('Operator-' + id);
      currentPerson = { name, role: role.label, code: name + '/' + role.label };
      pendingOperatorId = null;
      operatorPasswordError = null;
      pendingRole = null;
      screen = 'menu';
      await withLoading(()=>refreshRemoteIfStale(4000));
      renderStage();
    };
    document.getElementById('opPasswordGo').onclick = submit;
    input.onkeydown = (e)=>{ if(e.key==='Enter') submit(); };
  }

  // ---------- take ----------
  async function submitTake(itemName, category, qty, hours, onError){
    const payload = {
      action:'take',
      person: currentPerson.name,
      role: currentPerson.role,
      item: itemName,
      category: category,
      qty: qty,
      expectedReturn: hours ? new Date(Date.now() + hours*3600*1000).toISOString() : null
    };
    const result = await postAction(payload);
    if(!result.ok){
      onError('Something went wrong saving this — check your connection and try again.');
      return;
    }
    await refreshRemote();
    confirmInfo = {
      icon: category==='Tools' ? '🧰' : '✅',
      msg: category==='Tools' ? 'Checked out' : 'Taken from inventory',
      detail: `${iconForRef(category)} ${qty} × ${itemName}` + (payload.expectedReturn ? ` — return by ${fmtDate(payload.expectedReturn)}` : ' — logged as used, no return needed')
    };
    screen='confirm';
    renderStage();
  }

  function hoursLabel(hours){
    if(hours===4) return 'end of day';
    if(hours===24) return 'tomorrow';
    if(hours===72) return '3 days';
    if(hours===168) return '1 week';
    return hours + ' hrs';
  }

  function basketQtyFor(itemName){
    return basket.filter(b=>b.itemName===itemName).reduce((s,b)=>s+b.qty,0);
  }

  function basketQtyForExcluding(itemName, excludeId){
    return basket.filter(b=>b.itemName===itemName && b.id!==excludeId).reduce((s,b)=>s+b.qty,0);
  }

  function addToBasketAndReview(itemName, category, qty, hours){
    basket.push({ id: ++basketIdCounter, itemName, category, qty, hours });
    screen = 'basketReview';
    renderStage();
  }

  let basketError = null;

  function stageBasketReview(stage, banner){
    stage.innerHTML = banner + `
      <div class="greet" style="margin-bottom:10px;"><div class="name" style="font-size:18px;">Your items (${basket.length})</div></div>
      <table>
        <thead><tr><th>Item</th><th>Qty</th><th>Detail</th><th></th></tr></thead>
        <tbody>
          ${basket.length ? basket.map(b=>`
            <tr>
              <td>${itemThumbHTML(b.itemName, 28)} ${esc(b.itemName)}</td>
              <td><input type="number" min="1" value="${b.qty}" data-qty-for="${b.id}" style="width:56px;background:var(--panel-alt);border:1px solid var(--border);color:var(--text);padding:5px 6px;border-radius:4px;font-family:'IBM Plex Mono',monospace;font-size:12.5px;" /></td>
              <td>${b.category==='Tools' ? 'Return ' + hoursLabel(b.hours) : (b.category==='Station Parts' ? 'One-time use' : '')}</td>
              <td><button class="btn-ghost" data-remove="${b.id}" style="padding:4px 10px;font-size:10.5px;">Remove</button></td>
            </tr>
          `).join('') : `<tr><td colspan="4" style="text-align:center;color:var(--text-dim);padding:20px;">No items added yet.</td></tr>`}
        </tbody>
      </table>
      ${basketError ? `<div class="error-msg" style="margin-top:14px;">${esc(basketError)}</div>` : ''}
      <div style="display:flex;gap:10px;margin-top:22px;max-width:460px;margin-left:auto;margin-right:auto;">
        <button class="btn-ghost" id="addMoreBtn" style="flex:1;padding:12px;">➕ Add another item</button>
        <button class="go-btn" id="confirmAllBtn" style="flex:1;margin-top:0;" ${!basket.length?'disabled':''}>Confirm &amp; Take (${basket.length})</button>
      </div>
      <div style="text-align:center;margin-top:16px;"><span class="back-link" id="cancelBasket">Cancel, back to menu</span></div>
    `;
    document.getElementById('addMoreBtn').onclick = ()=>{ basketError=null; screen='scanPrompt'; renderStage(); };
    document.getElementById('cancelBasket').onclick = ()=>{ basket=[]; basketError=null; screen='menu'; renderStage(); };
    stage.querySelectorAll('[data-qty-for]').forEach(input=>{
      input.onchange = ()=>{
        const id = parseInt(input.getAttribute('data-qty-for'),10);
        const item = basket.find(b=>b.id===id);
        if(!item) return;
        let newQty = parseInt(input.value,10);
        if(!newQty || newQty < 1) newQty = 1;
        const cap = availableOf(item.itemName) - basketQtyForExcluding(item.itemName, id);
        if(cap >= 0 && newQty > cap){
          basketError = `Only ${cap} of "${item.itemName}" available — quantity capped.`;
          newQty = Math.max(1, cap);
        } else {
          basketError = null;
        }
        item.qty = newQty;
        renderStage();
      };
    });
    stage.querySelectorAll('[data-remove]').forEach(btn=>{
      btn.onclick = ()=>{
        const id = parseInt(btn.getAttribute('data-remove'),10);
        basket = basket.filter(b=>b.id!==id);
        renderStage();
      };
    });
    if(basket.length){
      document.getElementById('confirmAllBtn').onclick = async ()=>{
        const confirmBtn = document.getElementById('confirmAllBtn');
        setButtonBusy(confirmBtn, true, 'Saving...');
        basketError = null;
        const items = basket.map(b=>({
          item: b.itemName,
          category: b.category,
          qty: b.qty,
          expectedReturn: b.hours ? new Date(Date.now() + b.hours*3600*1000).toISOString() : null
        }));
        const result = await postAction({
          action:'takeBatch', person: currentPerson.name, role: currentPerson.role, items
        });
        await refreshRemote();
        if(!result.ok){
          basketError = result.error || 'Something went wrong saving your items — check your connection and tap Confirm again.';
          renderStage();
          return;
        }
        const detailLines = basket.map(b=>`${b.qty} × ${b.itemName}`).join(', ');
        confirmInfo = { icon:'✅', msg: `${basket.length} item(s) recorded`, detail: detailLines };
        basket = [];
        screen = 'confirm';
        renderStage();
      };
    }
  }

  // ---------- return ----------
  let returnBasket = [];
  let lastReturnAdded = null;
  let returnBasketError = null;

  function isInReturnBasket(txId){
    return returnBasket.some(r=>r.txId===txId);
  }

  function addToReturnBasket(tx){
    if(isInReturnBasket(tx.txId)) return;
    returnBasket.push(tx);
  }

  function stageReturn(stage, banner){
    let flash = '';
    if(lastReturnAdded){
      flash = `<div class="banner-error" style="background:#1f3a24;border-color:var(--success);color:#bdf2c9;">✅ Added: ${esc(lastReturnAdded)} — pick another, or review below</div>`;

    }
    const opens = allOpenToolCheckouts().filter(h=>!isInReturnBasket(h.txId));
    stage.innerHTML = banner + flash + `
      <span class="back-link" id="back">&larr; Back to menu</span>
      <div class="greet" style="margin-bottom:10px;"><div class="name" style="font-size:18px;">What are you returning?</div></div>

        ${opens.length ? opens.map(h=>`

  function stageReturnScanPrompt(stage, banner){

      renderStage();
    };
  }

  function tryHandleReturnScan(text){
    const tx = historyRows.find(h=>h.txId===pendingReturnTx);
    if(!tx){
      returnScanError = 'Lost track of this item — go back and select it again.';
      renderStage();
      return;
    }
    const trimmed = text.trim();
    const norm = normalizeText(trimmed);
    const expected = normalizeText(tx.item);
    const isMatch = norm === expected || norm.includes(expected) || expected.includes(norm);
    if(!isMatch){
      returnScanError = `Scanned: "${trimmed}" — doesn't match "${tx.item}". Try again, or use "Return without QR code" below.`;
      renderStage();
      return;
    }
    returnScanError = null;
    addToReturnBasket(tx);
    lastReturnAdded = tx.item;
    pendingReturnTx = null;
    screen = 'return';
    renderStage();
  }

        <button class="nav-btn ${reportTab==='open'?'active':''}" data-t="open">Open (${openTx.length})</button>
        <button class="nav-btn ${reportTab==='overdue'?'active':''}" data-t="overdue">Overdue (${overdueTx.length})</button>
        <button class="nav-btn ${reportTab==='all'?'active':''}" data-t="all">Full History</button>
        <button class="nav-btn ${reportTab==='stock'?'active':''}" data-t="stock">Inventory Status</button>
      </div>
      ${reportTab==='stock' ? `
        <div>
          <div style="font-family:'Oswald',sans-serif;font-size:12px;text-transform:uppercase;letter-spacing:0.05em;color:var(--text-dim);margin:0 0 8px;">Tools</div>
          ${toolItems.length ? toolItems.map(it=>`<div class="stockbar">
              <span>${iconForRef('Tools')} ${esc(it.item)}</span>
              <span class="stock ${String(it.availability||'').includes('missing')?'low':''}">${esc(it.availability||'—')}</span>
            </div>`).join('') : `<div class="empty-note">No tools yet.</div>`}
          <div style="font-family:'Oswald',sans-serif;font-size:12px;text-transform:uppercase;letter-spacing:0.05em;color:var(--text-dim);margin:18px 0 8px;">Station Parts</div>
          ${partItems.length ? partItems.map(it=>{
            const low = Number(it.quantity) <= 3;
            return `<div class="stockbar">
              <span>${iconForRef('Station Parts')} ${esc(it.item)}</span>
              <span class="stock ${low?'low':''}">${it.quantity!=null?it.quantity:'—'} left ${it.availability==='X'?'— OUT':''}</span>
            </div>`;
          }).join('') : `<div class="empty-note">No station parts yet.</div>`}
        </div>
      ` : `
        ${rows.length ? `
        <table>
          <thead><tr><th>Taken By</th><th>Item</th><th>Taken</th><th>Expected</th><th>Returned</th><th>Returned By</th></tr></thead>
          <tbody>
            ${rows.map(h=>`
              <tr class="${isOverdue(h) ? 'overdue':''}">
                <td>${esc(h.personRole)}</td>
                <td>${itemThumbHTML(h.item, 28)} ${esc(h.item)}</td>
                <td>${fmtDate(h.timestamp)}</td>
                <td>${fmtDate(h.expectedReturn)}</td>
                <td>${h.returnedAt==='N/A' ? '<span class="pill">n/a</span>' : (h.returnedAt==='Not returned' ? (isOverdue(h) ? '<span class="pill over">overdue</span>' : '<span class="pill open">out</span>') : '<span class="pill done">'+fmtDate(h.returnedAt)+'</span>')}</td>
                <td>${h.returnedAt==='Not returned' ? '—' : esc(h.returnedBy || '—')}</td>
              </tr>`).join('')}
          </tbody>
        </table>` : `<div class="empty-note">Nothing here yet.</div>`}
      `}
    `;
    document.getElementById('reportBack').onclick = ()=>{
      const ret = reportReturnScreen;
      if(ret === 'idle'){ currentPerson=null; basket=[]; returnBasket=[]; }
      screen = ret;
      renderStage();
    };
    stage.querySelectorAll('.report-tabs button').forEach(b=>{
      b.onclick = ()=>{ reportTab = b.getAttribute('data-t'); renderStage(); };
    });
  }

  // ---------- barcode/QR scanner support ----------
  // The Inateck BCST-23 (and most handheld scanners) acts like a keyboard:
  // it "types" the encoded text very fast, then presses Enter. We detect that
  // speed pattern to tell a scan apart from normal human typing, and jump
  // straight to that item once a match is found in the current inventory.
  const SCAN_MAX_GAP_MS = 300;

  function normalizeText(s){
    return domain.normalizeText(s);
  }

  let lastScanAdded = null;

  function tryHandleScan(text){
    if(!currentPerson) return; // must be signed in first
    if(screen === 'returnScanPrompt') return tryHandleReturnScan(text);
    if(screen !== 'scanPrompt') return; // only accept take-flow scans on the scan screen
    const trimmed = text.trim();
    const norm = normalizeText(trimmed);
    if(norm === 'other'){
      scanNotFoundError = null;
      pendingScanItem = OTHER_SENTINEL;
      screen = 'scanConfirm';
      renderStage();
      return;
    }
    let matchName = Object.keys(inventoryMap).find(name => normalizeText(name) === norm);
    if(!matchName){
      matchName = Object.keys(inventoryMap).find(name => {
        const n = normalizeText(name);
        return norm.includes(n) || n.includes(norm);
      });
    }
    if(!matchName){
      scanNotFoundError = `No matching item found for scan: "${trimmed}". (${Object.keys(inventoryMap).length} items loaded) Try again, or choose manually.`;
      renderStage();
      return;
    }
    const inv = inventoryMap[matchName];
    const avail = availableOf(matchName) - basketQtyFor(matchName);
    if(avail < 1){
      scanNotFoundError = `"${matchName}" isn't available right now (0 left after what's already in your list).`;
      renderStage();
      return;
    }
    scanNotFoundError = null;
    const hours = inv.reference==='Tools' ? 24 : null; // default; adjustable in the review list
    basket.push({ id: ++basketIdCounter, itemName: matchName, category: inv.reference, qty: 1, hours });
    lastScanAdded = matchName;
    renderStage(); // stay on the scan screen — ready for the next scan immediately
  }

  window.SupplyScanner.attachKeyboardScanner({
    maxGapMs: SCAN_MAX_GAP_MS,
    onScan: tryHandleScan
  });

  (async function init(){
    render();
    renderLoading(document.getElementById('stage'));
    await refreshRemote();
    renderStage();
  })();
})();
</script>
</body>
</html>
