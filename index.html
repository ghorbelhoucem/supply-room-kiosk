<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Supply Room — Check-Out Station</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=IBM+Plex+Mono:wght@500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  html,body{background:#1c1e22;}
  :root{
    --bg:#1c1e22;
    --panel:#24272c;
    --panel-alt:#2b2f35;
    --border:#3a3f45;
    --accent:#ff7a1a;
    --accent-hover:#ff9142;
    --accent-dim:#7a3d18;
    --success:#4caf6d;
    --danger:#e5484d;
    --text:#f2f0ea;
    --text-dim:#9aa0a6;
    --tag-bg:#111214;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:transparent;color:var(--text);font-family:'Inter',system-ui,sans-serif;}
  .app{max-width:920px;margin:0 auto;padding:28px 20px 40px;}

  /* header */
  .topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px;}
  .brand{display:flex;align-items:baseline;gap:10px;}
  .brand h1{font-family:'Oswald',sans-serif;font-weight:700;letter-spacing:0.06em;font-size:22px;margin:0;text-transform:uppercase;}
  .brand span{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--text-dim);letter-spacing:0.08em;}
  .nav-btn{background:var(--panel);border:1px solid var(--border);color:var(--text-dim);font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:0.05em;padding:8px 14px;border-radius:3px;cursor:pointer;text-transform:uppercase;transition:all .15s ease;}
  .nav-btn:hover{color:var(--text);border-color:var(--accent);}
  .nav-btn.active{background:var(--accent);color:#1c1e22;border-color:var(--accent);}

  .stage{background:var(--panel);border:1px solid var(--border);border-radius:6px;padding:32px;min-height:420px;position:relative;overflow:hidden;}
  .stage::before{content:"";position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--accent),transparent 70%);}

  /* badge reader */
  .reader-wrap{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;padding:20px 0 6px;text-align:center;}
  .slot{width:280px;height:80px;border:2px dashed var(--border);border-radius:8px;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;background:var(--panel-alt);}
  .slot .scanline{position:absolute;top:0;left:-40%;width:40%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,122,26,0.35),transparent);animation:scan 1.6s linear infinite;}
  @media (prefers-reduced-motion:reduce){.slot .scanline{animation:none;}}
  @keyframes scan{0%{left:-40%;}100%{left:100%;}}
  .slot input{background:transparent;border:none;outline:none;color:var(--text);font-family:'IBM Plex Mono',monospace;font-size:22px;letter-spacing:0.15em;text-align:center;width:90%;}
  .slot input::placeholder{color:var(--text-dim);letter-spacing:0.08em;}
  .hint{color:var(--text-dim);font-size:13px;margin-top:16px;font-family:'Inter',sans-serif;}
  .go-btn{margin-top:22px;background:var(--accent);color:#1c1e22;border:none;font-family:'Oswald',sans-serif;font-weight:600;text-transform:uppercase;letter-spacing:0.05em;font-size:14px;padding:12px 30px;border-radius:4px;cursor:pointer;transition:background .15s ease;}
  .go-btn:hover{background:var(--accent-hover);}
  .go-btn:disabled{background:var(--panel-alt);color:var(--text-dim);cursor:not-allowed;}
  .quick-codes{margin-top:18px;display:flex;gap:8px;flex-wrap:wrap;justify-content:center;}
  .quick-codes button{background:none;border:1px solid var(--border);color:var(--text-dim);font-family:'IBM Plex Mono',monospace;font-size:11px;padding:5px 10px;border-radius:3px;cursor:pointer;}
  .quick-codes button:hover{border-color:var(--accent);color:var(--text);}

  /* greeting */
  .greet{text-align:center;margin-bottom:24px;}
  .greet .name{font-family:'Oswald',sans-serif;font-size:26px;font-weight:600;text-transform:uppercase;letter-spacing:0.03em;}
  .greet .code{font-family:'IBM Plex Mono',monospace;color:var(--accent);font-size:13px;letter-spacing:0.1em;}

  .menu-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;max-width:520px;margin:0 auto;}
  .menu-card{background:var(--panel-alt);border:1px solid var(--border);border-radius:6px;padding:22px 16px;text-align:center;cursor:pointer;transition:all .15s ease;}
  .menu-card:hover{border-color:var(--accent);transform:translateY(-2px);}
  .menu-card .big{font-size:28px;margin-bottom:8px;}
  .menu-card .label{font-family:'Oswald',sans-serif;font-weight:600;text-transform:uppercase;letter-spacing:0.04em;font-size:14px;}
  .menu-card .sub{color:var(--text-dim);font-size:12px;margin-top:4px;}
  .menu-card.disabled{opacity:0.4;cursor:not-allowed;}
  .menu-card.disabled:hover{transform:none;border-color:var(--border);}

  .open-list{max-width:560px;margin:22px auto 0;}
  .open-list h3{font-family:'Oswald',sans-serif;font-size:13px;text-transform:uppercase;letter-spacing:0.06em;color:var(--text-dim);margin:0 0 8px;}
  .open-row{display:flex;align-items:center;justify-content:space-between;background:var(--panel-alt);border:1px solid var(--border);border-radius:4px;padding:10px 14px;margin-bottom:6px;font-size:13px;}
  .open-row.overdue{border-color:var(--danger);}
  .open-row .due{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--text-dim);}
  .open-row.overdue .due{color:var(--danger);}

  /* asset tags */
  .tag{display:inline-block;background:var(--tag-bg);border:1px solid #000;border-radius:2px;padding:2px 8px;font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:0.06em;color:#e8e6e1;}

  .item-list{display:flex;flex-direction:column;gap:8px;max-width:600px;margin:18px auto 0;max-height:300px;overflow-y:auto;padding-right:4px;}
  .item-row{display:flex;align-items:center;justify-content:space-between;background:var(--panel-alt);border:1px solid var(--border);border-radius:5px;padding:12px 16px;cursor:pointer;transition:border-color .15s ease;}
  .item-row:hover{border-color:var(--accent);}
  .item-row.selected{border-color:var(--accent);background:rgba(255,122,26,0.08);}
  .item-name{font-weight:600;font-size:14px;}
  .item-meta{color:var(--text-dim);font-size:12px;margin-top:2px;}
  .stock{font-family:'IBM Plex Mono',monospace;font-size:13px;}
  .stock.low{color:var(--danger);}

  .back-link{color:var(--text-dim);font-size:12px;cursor:pointer;display:inline-block;margin-bottom:14px;}
  .back-link:hover{color:var(--text);}

  .form-row{max-width:400px;margin:20px auto 0;}
  .form-row label{display:block;font-size:12px;color:var(--text-dim);margin-bottom:6px;text-transform:uppercase;letter-spacing:0.05em;}
  .form-row input,.form-row select{width:100%;background:var(--panel-alt);border:1px solid var(--border);color:var(--text);padding:10px 12px;border-radius:4px;font-family:'IBM Plex Mono',monospace;font-size:14px;margin-bottom:14px;}

  .confirm-box{text-align:center;padding:40px 0;}
  .confirm-box .icon{font-size:42px;margin-bottom:10px;}
  .confirm-box .msg{font-family:'Oswald',sans-serif;font-size:18px;text-transform:uppercase;letter-spacing:0.03em;}
  .confirm-box .detail{color:var(--text-dim);font-size:13px;margin-top:8px;}

  /* report */
  .report-tabs{display:flex;gap:8px;margin-bottom:16px;}
  table{width:100%;border-collapse:collapse;font-size:12.5px;}
  th{text-align:left;color:var(--text-dim);font-weight:500;text-transform:uppercase;letter-spacing:0.04em;font-size:10.5px;padding:8px 10px;border-bottom:1px solid var(--border);}
  td{padding:9px 10px;border-bottom:1px solid var(--border);}
  tr.overdue td{color:var(--danger);}
  .pill{font-family:'IBM Plex Mono',monospace;font-size:10.5px;padding:2px 7px;border-radius:10px;border:1px solid var(--border);}
  .pill.open{color:var(--accent);border-color:var(--accent-dim);}
  .pill.done{color:var(--success);border-color:#255c37;}
  .pill.over{color:var(--danger);border-color:#5c2527;}
  .stockbar{background:var(--panel-alt);border:1px solid var(--border);border-radius:5px;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;}
  .empty-note{color:var(--text-dim);text-align:center;padding:30px 0;font-size:13px;}
  .error-msg{color:var(--danger);font-size:12.5px;margin:-8px 0 12px;}
  .confirm-panel{max-width:420px;margin:24px auto 0;background:var(--panel-alt);border:1px solid var(--border);border-radius:6px;padding:20px;}
  .confirm-panel .q{font-size:14px;margin-bottom:16px;}
  .confirm-actions{display:flex;gap:10px;}
  .confirm-actions button{flex:1;padding:10px;border-radius:4px;border:1px solid var(--border);cursor:pointer;font-family:'Oswald',sans-serif;font-weight:600;text-transform:uppercase;font-size:13px;letter-spacing:0.03em;}
  .confirm-actions .yes{background:var(--accent);color:#1c1e22;border-color:var(--accent);}
  .confirm-actions .no{background:transparent;color:var(--text-dim);}
</style>
</head>
<body>

<div class="app" id="app"></div>

<script>
(function(){
  const STORE_KEY = 'kiosk-data';
  let state = null;
  let screen = 'idle'; // idle, register, menu, take, return, confirm, report
  let currentPerson = null; // {code,name,role}
  let pendingRole = null;
  let takeSelection = null; // {itemId, qty, expectedHours, category}
  let takeCategory = null; // 'tool' or 'consumable'
  let takeError = null;
  let pendingReturnTx = null; // tx id awaiting confirmation
  let confirmInfo = null;
  let reportTab = 'open';

  const PLACEHOLDER_TOOL_QTY = 5;
  const PLACEHOLDER_ASSET_QTY = 15;

  const seed = () => ({
    employees: {},
    items: [
      // ---- TOOLS (checkout & return) ----
      {id:'T-001', name:'Screwdriver', type:'tool', icon:'🪛', total:PLACEHOLDER_TOOL_QTY},
      {id:'T-002', name:'Zip Ties Cutter', type:'tool', icon:'✂️', total:PLACEHOLDER_TOOL_QTY},
      {id:'T-003', name:'Scissors', type:'tool', icon:'✂️', total:PLACEHOLDER_TOOL_QTY},
      {id:'T-004', name:'Knife (Cutter)', type:'tool', icon:'🔪', total:PLACEHOLDER_TOOL_QTY},
      {id:'T-005', name:'Measuring Tape', type:'tool', icon:'📏', total:PLACEHOLDER_TOOL_QTY},

      // ---- ONE-WAY ITEMS (taken = -1, no return) — real station inventory ----
      {id:'A-001', name:'Ethernet Cable', type:'consumable', icon:'🌐', total:PLACEHOLDER_ASSET_QTY},
      {id:'A-002', name:'Head Camera Cable (USB-C)', type:'consumable', icon:'🔌', total:PLACEHOLDER_ASSET_QTY},
      {id:'A-003', name:'Head Camera Cable (C-C)', type:'consumable', icon:'🔌', total:PLACEHOLDER_ASSET_QTY},
      {id:'A-004', name:'Environmental Camera Cable', type:'consumable', icon:'🔌', total:PLACEHOLDER_ASSET_QTY},
      {id:'A-005', name:'Power Cable (PC/Monitor)', type:'consumable', icon:'🔌', total:PLACEHOLDER_ASSET_QTY},
      {id:'A-006', name:'Control Box Power Cable', type:'consumable', icon:'🔌', total:PLACEHOLDER_ASSET_QTY},
      {id:'A-007', name:'Monitor Power Supply', type:'consumable', icon:'⚡', total:PLACEHOLDER_ASSET_QTY},
      {id:'A-008', name:'Switch Power Supply', type:'consumable', icon:'⚡', total:PLACEHOLDER_ASSET_QTY},
      {id:'A-009', name:'HDMI Cable', type:'consumable', icon:'📺', total:PLACEHOLDER_ASSET_QTY},
      {id:'A-010', name:'DP Monitor Cable', type:'consumable', icon:'🖥️', total:PLACEHOLDER_ASSET_QTY},
      {id:'A-011', name:'Head Camera', type:'consumable', icon:'📷', total:PLACEHOLDER_ASSET_QTY},
      {id:'A-012', name:'Wrist Camera', type:'consumable', icon:'📷', total:PLACEHOLDER_ASSET_QTY},
      {id:'A-013', name:'Environmental Camera', type:'consumable', icon:'📷', total:PLACEHOLDER_ASSET_QTY},
      {id:'A-014', name:'Monitor (Screen)', type:'consumable', icon:'🖥️', total:PLACEHOLDER_ASSET_QTY},
      {id:'A-015', name:'Keyboard', type:'consumable', icon:'⌨️', total:PLACEHOLDER_ASSET_QTY},
      {id:'A-016', name:'Mouse', type:'consumable', icon:'🖱️', total:PLACEHOLDER_ASSET_QTY},
      {id:'A-017', name:'Power Socket', type:'consumable', icon:'🔌', total:PLACEHOLDER_ASSET_QTY},
      {id:'A-018', name:'Arm Power Cable', type:'consumable', icon:'🔌', total:PLACEHOLDER_ASSET_QTY},
      {id:'A-019', name:'Gripper Power Supply', type:'consumable', icon:'⚡', total:PLACEHOLDER_ASSET_QTY},
      {id:'A-020', name:'Station Monitor Touchpad Cable', type:'consumable', icon:'🔌', total:PLACEHOLDER_ASSET_QTY},
      {id:'A-021', name:'Emergency Button', type:'consumable', icon:'🛑', total:PLACEHOLDER_ASSET_QTY},
      {id:'A-022', name:'Franka Arm', type:'consumable', icon:'🦾', total:PLACEHOLDER_ASSET_QTY},
      {id:'A-023', name:'Control Box', type:'consumable', icon:'📦', total:PLACEHOLDER_ASSET_QTY},
      {id:'A-024', name:'PC', type:'consumable', icon:'🖥️', total:PLACEHOLDER_ASSET_QTY},
      {id:'A-025', name:'Screws', type:'consumable', icon:'🔩', total:PLACEHOLDER_ASSET_QTY},
      {id:'A-026', name:'Zip Ties', type:'consumable', icon:'🔗', total:PLACEHOLDER_ASSET_QTY}
    ],
    transactions: []
  });

  async function load(){
    try{
      const raw = localStorage.getItem(STORE_KEY);
      if(!raw) throw new Error('no data yet');
      state = JSON.parse(raw);
    }catch(e){
      state = seed();
      await save();
    }
    render();
  }
  async function save(){
    try{ localStorage.setItem(STORE_KEY, JSON.stringify(state)); }
    catch(e){ console.error('storage error', e); }
  }

  function availableOf(itemId){
    const item = state.items.find(i=>i.id===itemId);
    if(!item) return 0;
    if(item.type==='consumable') return item.total;
    const out = state.transactions.filter(t=>t.itemId===itemId && !t.returnedAt).reduce((s,t)=>s+t.qty,0);
    return item.total - out;
  }

  function iconFor(itemId){
    const item = state.items.find(i=>i.id===itemId);
    return item && item.icon ? item.icon : '';
  }

  function openCheckoutsFor(code){
    return state.transactions.filter(t=>t.code===code && t.type==='tool' && !t.returnedAt);
  }

  function isOverdue(t){
    return !t.returnedAt && new Date(t.expectedReturn).getTime() < Date.now();
  }

  function fmtDate(d){
    const dt = new Date(d);
    return dt.toLocaleDateString(undefined,{month:'short',day:'numeric'}) + ' ' + dt.toLocaleTimeString(undefined,{hour:'numeric',minute:'2-digit'});
  }

  function esc(s){ return String(s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

  // ---------- render ----------
  function render(){
    const app = document.getElementById('app');
    app.innerHTML = `
      <div class="topbar">
        <div class="brand"><h1>Supply Room</h1><span>CHECK-OUT STATION</span></div>
        <button class="nav-btn ${screen==='report'?'active':''}" id="reportBtn">${screen==='report' ? 'Close Report' : 'Manager Report'}</button>
      </div>
      <div class="stage" id="stage"></div>
    `;
    document.getElementById('reportBtn').onclick = ()=>{
      screen = screen==='report' ? 'idle' : 'report';
      currentPerson = null;
      renderStage();
    };
    renderStage();
  }

  function renderStage(){
    const stage = document.getElementById('stage');
    if(screen==='idle') return stageRoleSelect(stage);
    if(screen==='nameSelect') return stageNameSelect(stage);
    if(screen==='operatorId') return stageOperatorId(stage);
    if(screen==='menu') return stageMenu(stage);
    if(screen==='takeCategory') return stageTakeCategory(stage);
    if(screen==='take') return stageTake(stage);
    if(screen==='return') return stageReturn(stage);
    if(screen==='confirm') return stageConfirm(stage);
    if(screen==='report') return stageReport(stage);
  }

  const ROLES = {
    maintenance: { label: 'Maintenance Team', icon: '🔧', kind: 'names', names: ['Marwan','Houcem','Hamza','Ahmed','Felix','Yie'] },
    management:  { label: 'Management Team', icon: '📋', kind: 'names', names: ['Rosa','Clarissa','Bingie'] },
    supervisor:  { label: 'Supervisor', icon: '🧭', kind: 'operatorId' },
    teleoperator:{ label: 'Tele-operator', icon: '🎮', kind: 'operatorId' }
  };

  function stageRoleSelect(stage){
    stage.innerHTML = `
      <div class="reader-wrap" style="padding-top:6px;">
        <div class="hint" style="margin-top:0;margin-bottom:18px;">Who's checking in?</div>
        <div class="menu-grid" style="max-width:520px;">
          ${Object.keys(ROLES).map(key=>`
            <div class="menu-card" data-role="${key}">
              <div class="big">${ROLES[key].icon}</div>
              <div class="label">${ROLES[key].label}</div>
            </div>
          `).join('')}
        </div>
      </div>
    `;
    stage.querySelectorAll('.menu-card[data-role]').forEach(card=>{
      card.onclick = ()=>{
        const key = card.getAttribute('data-role');
        pendingRole = key;
        screen = ROLES[key].kind === 'names' ? 'nameSelect' : 'operatorId';
        renderStage();
      };
    });
  }

  function stageNameSelect(stage){
    const role = ROLES[pendingRole];
    stage.innerHTML = `
      <span class="back-link" id="back">&larr; Back</span>
      <div class="reader-wrap" style="padding-top:6px;">
        <div class="hint" style="margin-top:0;margin-bottom:18px;">${role.icon} ${esc(role.label)} — who are you?</div>
        <div class="menu-grid" style="max-width:520px;grid-template-columns:1fr 1fr 1fr;">
          ${role.names.map(n=>`<div class="menu-card" data-name="${esc(n)}" style="padding:18px 10px;">
            <div class="label" style="font-size:13px;">${esc(n)}</div>
          </div>`).join('')}
        </div>
      </div>
    `;
    document.getElementById('back').onclick = ()=>{ pendingRole=null; screen='idle'; renderStage(); };
    stage.querySelectorAll('.menu-card[data-name]').forEach(card=>{
      card.onclick = ()=>{
        const name = card.getAttribute('data-name');
        currentPerson = { code: role.label + ':' + name, name, role: role.label };
        pendingRole = null;
        screen = 'menu';
        renderStage();
      };
    });
  }

  function stageOperatorId(stage){
    const role = ROLES[pendingRole];
    stage.innerHTML = `
      <span class="back-link" id="back">&larr; Back</span>
      <div class="reader-wrap" style="padding-top:6px;">
        <div class="hint" style="margin-top:0;">${role.icon} ${esc(role.label)} — enter your operator ID</div>
        <div class="slot" style="margin-top:16px;">
          <input id="opIdInput" placeholder="OPERATOR ID (numbers)" inputmode="numeric" maxlength="6" />
        </div>
        <button class="go-btn" id="opGoBtn">Sign In</button>
      </div>
    `;
    document.getElementById('back').onclick = ()=>{ pendingRole=null; screen='idle'; renderStage(); };
    const input = document.getElementById('opIdInput');
    input.focus();
    const submit = ()=>{
      const num = input.value.trim().replace(/\D/g,'');
      if(!num) return;
      const name = 'Operator-' + num;
      currentPerson = { code: 'operator-' + num, name, role: role.label };
      pendingRole = null;
      screen = 'menu';
      renderStage();
    };
    document.getElementById('opGoBtn').onclick = submit;
    input.onkeydown = (e)=>{ if(e.key==='Enter') submit(); };
  }

  function stageMenu(stage){
    const opens = openCheckoutsFor(currentPerson.code);
    const anyOpen = opens.length > 0;
    stage.innerHTML = `
      <div class="greet">
        <div class="name">Hi, ${esc(currentPerson.name)}</div>
        <div class="code">${esc(currentPerson.role)}</div>
      </div>
      <div class="menu-grid">
        <div class="menu-card" id="takeCard">
          <div class="big">📦</div>
          <div class="label">Take Something</div>
          <div class="sub">Tools or one-time-use items</div>
        </div>
        <div class="menu-card ${anyOpen?'':'disabled'}" id="returnCard">
          <div class="big">↩️</div>
          <div class="label">Return a Tool</div>
          <div class="sub">${anyOpen ? opens.length + ' item(s) checked out' : 'Nothing checked out'}</div>
        </div>
      </div>
      ${anyOpen ? `<div class="open-list"><h3>Currently checked out to you</h3>
        ${opens.map(t=>`
          <div class="open-row ${isOverdue(t)?'overdue':''}">
            <span><span class="tag">${esc(t.itemId)}</span> &nbsp;${iconFor(t.itemId)} ${esc(t.itemName)} × ${t.qty}</span>
            <span class="due">${isOverdue(t)?'OVERDUE · ':'due '}${fmtDate(t.expectedReturn)}</span>
          </div>`).join('')}
        </div>` : ''}
      <div style="text-align:center;margin-top:22px;"><span class="back-link" id="signOut">Sign out</span></div>
    `;
    document.getElementById('takeCard').onclick = ()=>{ screen='takeCategory'; renderStage(); };
    if(anyOpen){
      document.getElementById('returnCard').onclick = ()=>{ returnSelection = null; screen='return'; renderStage(); };
    }
    document.getElementById('signOut').onclick = ()=>{ currentPerson=null; screen='idle'; renderStage(); };
  }

  function stageTakeCategory(stage){
    stage.innerHTML = `
      <span class="back-link" id="back">&larr; Back to menu</span>
      <div class="greet" style="margin-bottom:10px;"><div class="name" style="font-size:18px;">What are you taking?</div></div>
      <div class="menu-grid">
        <div class="menu-card" id="toolsCard">
          <div class="big">🧰</div>
          <div class="label">Tools</div>
          <div class="sub">Borrow &amp; bring back</div>
        </div>
        <div class="menu-card" id="partsCard">
          <div class="big">🔌</div>
          <div class="label">Station Parts</div>
          <div class="sub">Cables, cameras, monitors &amp; more — one-time use</div>
        </div>
      </div>
    `;
    document.getElementById('back').onclick = ()=>{ screen='menu'; renderStage(); };
    document.getElementById('toolsCard').onclick = ()=>{
      takeCategory = 'tool';
      takeSelection = {itemId:null, qty:1, hours:24};
      screen='take'; renderStage();
    };
    document.getElementById('partsCard').onclick = ()=>{
      takeCategory = 'consumable';
      takeSelection = {itemId:null, qty:1, hours:24};
      screen='take'; renderStage();
    };
  }

  function stageTake(stage){
    const selected = takeSelection.itemId;
    const items = state.items.filter(it=>it.type===takeCategory);
    stage.innerHTML = `
      <span class="back-link" id="back">&larr; Back</span>
      <div class="greet" style="margin-bottom:10px;"><div class="name" style="font-size:18px;">${takeCategory==='tool' ? 'Which tool?' : 'Which part?'}</div></div>
      <div class="item-list">
        ${items.map(it=>{
          const avail = availableOf(it.id);
          const low = it.type==='consumable' && avail <= it.total*0.2;
          return `<div class="item-row ${selected===it.id?'selected':''}" data-id="${it.id}">
            <div>
              <span class="tag">${it.id}</span>
              <div class="item-name" style="margin-top:5px;">${it.icon||''} ${esc(it.name)}</div>
              <div class="item-meta">${it.type==='tool' ? 'Checkout &amp; return' : 'One-time use'}</div>
            </div>
            <div class="stock ${low?'low':''}">${avail} avail</div>
          </div>`;
        }).join('')}
      </div>
      <div class="form-row" id="detailsForm" style="display:${selected?'block':'none'}">
        <label>Quantity</label>
        <input type="number" id="qtyInput" min="1" value="${takeSelection.qty}" />
        <div id="returnTimeWrap" style="display:none;">
          <label>Expected return</label>
          <select id="hoursSelect">
            <option value="4">End of day (4 hrs)</option>
            <option value="24" selected>Tomorrow (24 hrs)</option>
            <option value="72">3 days</option>
            <option value="168">1 week</option>
          </select>
        </div>
        ${takeError ? `<div class="error-msg">${esc(takeError)}</div>` : ''}
        <button class="go-btn" id="confirmTake" style="width:100%;">Confirm</button>
      </div>
    `;
    document.getElementById('back').onclick = ()=>{ takeError=null; screen='takeCategory'; renderStage(); };
    stage.querySelectorAll('.item-row').forEach(row=>{
      row.onclick = ()=>{
        takeSelection.itemId = row.getAttribute('data-id');
        takeError = null;
        renderStage();
        setTimeout(()=>{
          document.getElementById('qtyInput').focus();
          const item = state.items.find(i=>i.id===takeSelection.itemId);
          document.getElementById('returnTimeWrap').style.display = item.type==='tool' ? 'block' : 'none';
        },0);
      };
    });
    if(selected){
      const item = state.items.find(i=>i.id===selected);
      document.getElementById('returnTimeWrap').style.display = item.type==='tool' ? 'block' : 'none';
      document.getElementById('confirmTake').onclick = ()=>{
        const qty = parseInt(document.getElementById('qtyInput').value,10) || 1;
        const avail = availableOf(item.id);
        if(!qty || qty < 1){ takeError = 'Enter a quantity of at least 1.'; renderStage(); return; }
        if(qty > avail){ takeError = 'Only ' + avail + ' available right now.'; renderStage(); return; }
        takeError = null;
        const hours = item.type==='tool' ? parseInt(document.getElementById('hoursSelect').value,10) : null;
        doTake(item, qty, hours);
      };
    }
  }

  function doTake(item, qty, hours){
    const tx = {
      id: 'tx_' + Date.now() + '_' + Math.floor(Math.random()*1000),
      code: currentPerson.code,
      name: currentPerson.name,
      role: currentPerson.role,
      itemId: item.id,
      itemName: item.name,
      type: item.type,
      qty,
      takenAt: new Date().toISOString(),
      expectedReturn: hours ? new Date(Date.now() + hours*3600*1000).toISOString() : null,
      returnedAt: null
    };
    if(item.type==='consumable'){
      item.total -= qty;
    }
    state.transactions.push(tx);
    save();
    confirmInfo = {
      icon: item.type==='tool' ? '🧰' : '✅',
      msg: item.type==='tool' ? 'Checked out' : 'Taken from inventory',
      detail: `${item.icon||''} ${qty} × ${item.name}` + (tx.expectedReturn ? ` — return by ${fmtDate(tx.expectedReturn)}` : ' — logged as used, no return needed')
    };
    screen='confirm';
    renderStage();
  }

  function stageReturn(stage){
    const opens = openCheckoutsFor(currentPerson.code);
    const pendingTx = pendingReturnTx ? state.transactions.find(t=>t.id===pendingReturnTx) : null;
    stage.innerHTML = `
      <span class="back-link" id="back">&larr; Back to menu</span>
      <div class="greet" style="margin-bottom:10px;"><div class="name" style="font-size:18px;">What are you returning?</div></div>
      <div class="item-list">
        ${opens.map(t=>`
          <div class="item-row ${pendingReturnTx===t.id?'selected':''}" data-id="${t.id}">
            <div>
              <span class="tag">${t.itemId}</span>
              <div class="item-name" style="margin-top:5px;">${iconFor(t.itemId)} ${esc(t.itemName)} × ${t.qty}</div>
              <div class="item-meta">taken ${fmtDate(t.takenAt)}</div>
            </div>
            <div class="stock ${isOverdue(t)?'low':''}">${isOverdue(t)?'OVERDUE':('due '+fmtDate(t.expectedReturn))}</div>
          </div>`).join('')}
      </div>
      ${pendingTx ? `
        <div class="confirm-panel">
          <div class="q">Confirm you're returning <strong>${iconFor(pendingTx.itemId)} ${pendingTx.qty} × ${esc(pendingTx.itemName)}</strong>?</div>
          <div class="confirm-actions">
            <button class="no" id="cancelReturn">Cancel</button>
            <button class="yes" id="okReturn">Yes, returned</button>
          </div>
        </div>
      ` : ''}
    `;
    document.getElementById('back').onclick = ()=>{ pendingReturnTx=null; screen='menu'; renderStage(); };
    stage.querySelectorAll('.item-row').forEach(row=>{
      row.onclick = ()=>{ pendingReturnTx = row.getAttribute('data-id'); renderStage(); };
    });
    if(pendingTx){
      document.getElementById('cancelReturn').onclick = ()=>{ pendingReturnTx=null; renderStage(); };
      document.getElementById('okReturn').onclick = ()=>{
        pendingTx.returnedAt = new Date().toISOString();
        save();
        pendingReturnTx = null;
        confirmInfo = { icon:'✅', msg:'Returned', detail: `${iconFor(pendingTx.itemId)} ${pendingTx.qty} × ${pendingTx.itemName} is back in the supply room` };
        screen='confirm';
        renderStage();
      };
    }
  }

  function stageConfirm(stage){
    stage.innerHTML = `
      <div class="confirm-box">
        <div class="icon">${confirmInfo.icon}</div>
        <div class="msg">${esc(confirmInfo.msg)}</div>
        <div class="detail">${esc(confirmInfo.detail)}</div>
        <button class="go-btn" id="doneBtn" style="margin-top:26px;">Done</button>
      </div>
    `;
    document.getElementById('doneBtn').onclick = ()=>{ currentPerson=null; screen='idle'; renderStage(); };
    setTimeout(()=>{ if(screen==='confirm'){ currentPerson=null; screen='idle'; renderStage(); } }, 6000);
  }

  function stageReport(stage){
    const openTx = state.transactions.filter(t=>t.type==='tool' && !t.returnedAt);
    const overdueTx = openTx.filter(isOverdue);
    const allTx = [...state.transactions].sort((a,b)=> new Date(b.takenAt)-new Date(a.takenAt));
    const consumables = state.items.filter(i=>i.type==='consumable');

    let rows = [];
    if(reportTab==='open') rows = openTx;
    else if(reportTab==='overdue') rows = overdueTx;
    else rows = allTx;

    stage.innerHTML = `
      <div class="report-tabs">
        <button class="nav-btn ${reportTab==='open'?'active':''}" data-t="open">Open (${openTx.length})</button>
        <button class="nav-btn ${reportTab==='overdue'?'active':''}" data-t="overdue">Overdue (${overdueTx.length})</button>
        <button class="nav-btn ${reportTab==='all'?'active':''}" data-t="all">Full History</button>
        <button class="nav-btn ${reportTab==='stock'?'active':''}" data-t="stock">Consumable Stock</button>
      </div>
      ${reportTab==='stock' ? `
        <div>
          ${consumables.map(it=>{
            const pct = Math.round((it.total / seedTotal(it.id)) * 100);
            const low = pct <= 20;
            return `<div class="stockbar">
              <span><span class="tag">${it.id}</span> &nbsp;${it.icon||''} ${esc(it.name)}</span>
              <span class="stock ${low?'low':''}">${it.total} left${low?' — reorder soon':''}</span>
            </div>`;
          }).join('')}
        </div>
      ` : `
        ${rows.length ? `
        <table>
          <thead><tr><th>Person</th><th>Item</th><th>Qty</th><th>Taken</th><th>Expected</th><th>Status</th></tr></thead>
          <tbody>
            ${rows.map(t=>`
              <tr class="${(t.type==='tool' && !t.returnedAt && isOverdue(t)) ? 'overdue':''}">
                <td>${esc(t.name)} <span style="color:var(--text-dim);font-family:'IBM Plex Mono',monospace;font-size:10.5px;">(${esc(t.role||'')})</span></td>
                <td><span class="tag">${t.itemId}</span> ${iconFor(t.itemId)} ${esc(t.itemName)}</td>
                <td>${t.qty}</td>
                <td>${fmtDate(t.takenAt)}</td>
                <td>${t.expectedReturn ? fmtDate(t.expectedReturn) : '—'}</td>
                <td>${t.type==='consumable' ? '<span class="pill done">used</span>' : (t.returnedAt ? '<span class="pill done">returned</span>' : (isOverdue(t) ? '<span class="pill over">overdue</span>' : '<span class="pill open">out</span>'))}</td>
              </tr>`).join('')}
          </tbody>
        </table>` : `<div class="empty-note">Nothing here yet.</div>`}
      `}
    `;
    stage.querySelectorAll('.report-tabs button').forEach(b=>{
      b.onclick = ()=>{ reportTab = b.getAttribute('data-t'); renderStage(); };
    });
  }

  function seedTotal(itemId){
    const s = seed();
    const it = s.items.find(i=>i.id===itemId);
    return it ? it.total : 1;
  }

  load();
})();
</script>
</body>
</html>
