<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Supply Room — Check-Out Station</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=IBM+Plex+Mono:wght@500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  html,body{background:#1c1e22;}
  :root{
    --bg:#1c1e22;
    --panel:#24272c;
    --panel-alt:#2b2f35;
    --border:#3a3f45;
    --accent:#ff7a1a;
    --accent-hover:#ff9142;
    --accent-dim:#7a3d18;
    --success:#4caf6d;
    --danger:#e5484d;
    --text:#f2f0ea;
    --text-dim:#9aa0a6;
    --tag-bg:#111214;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:transparent;color:var(--text);font-family:'Inter',system-ui,sans-serif;}
  .app{max-width:920px;margin:0 auto;padding:28px 20px 40px;}
  .topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px;}
  .brand{display:flex;align-items:baseline;gap:10px;}
  .brand h1{font-family:'Oswald',sans-serif;font-weight:700;letter-spacing:0.06em;font-size:22px;margin:0;text-transform:uppercase;}
  .brand span{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--text-dim);letter-spacing:0.08em;}
  .nav-btn{background:var(--panel);border:1px solid var(--border);color:var(--text-dim);font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:0.05em;padding:8px 14px;border-radius:3px;cursor:pointer;text-transform:uppercase;transition:all .15s ease;}
  .nav-btn:hover{color:var(--text);border-color:var(--accent);}
  .nav-btn.active{background:var(--accent);color:#1c1e22;border-color:var(--accent);}
  .stage{background:var(--panel);border:1px solid var(--border);border-radius:6px;padding:32px;min-height:420px;position:relative;overflow:hidden;}
  .stage::before{content:"";position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--accent),transparent 70%);}
  .reader-wrap{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;padding:20px 0 6px;text-align:center;}
  .slot{width:280px;height:80px;border:2px dashed var(--border);border-radius:8px;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;background:var(--panel-alt);}
  .hint{color:var(--text-dim);font-size:13px;margin-top:16px;font-family:'Inter',sans-serif;}
  .go-btn{margin-top:22px;background:var(--accent);color:#1c1e22;border:none;font-family:'Oswald',sans-serif;font-weight:600;text-transform:uppercase;letter-spacing:0.05em;font-size:14px;padding:12px 30px;border-radius:4px;cursor:pointer;transition:background .15s ease;}
  .go-btn:hover{background:var(--accent-hover);}
  .go-btn:disabled{background:var(--panel-alt);color:var(--text-dim);cursor:not-allowed;}
  .greet{text-align:center;margin-bottom:24px;}
  .greet .name{font-family:'Oswald',sans-serif;font-size:26px;font-weight:600;text-transform:uppercase;letter-spacing:0.03em;}
  .greet .code{font-family:'IBM Plex Mono',monospace;color:var(--accent);font-size:13px;letter-spacing:0.1em;}
  .menu-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;max-width:520px;margin:0 auto;}
  .menu-card{background:var(--panel-alt);border:1px solid var(--border);border-radius:6px;padding:22px 16px;text-align:center;cursor:pointer;transition:all .15s ease;}
  .menu-card:hover{border-color:var(--accent);transform:translateY(-2px);}
  .menu-card .big{font-size:28px;margin-bottom:8px;}
  .menu-card .label{font-family:'Oswald',sans-serif;font-weight:600;text-transform:uppercase;letter-spacing:0.04em;font-size:14px;}
  .menu-card .sub{color:var(--text-dim);font-size:12px;margin-top:4px;}
  .menu-card.disabled{opacity:0.4;cursor:not-allowed;}
  .menu-card.disabled:hover{transform:none;border-color:var(--border);}
  .open-list{max-width:560px;margin:22px auto 0;}
  .open-list h3{font-family:'Oswald',sans-serif;font-size:13px;text-transform:uppercase;letter-spacing:0.06em;color:var(--text-dim);margin:0 0 8px;}
  .open-row{display:flex;align-items:center;justify-content:space-between;background:var(--panel-alt);border:1px solid var(--border);border-radius:4px;padding:10px 14px;margin-bottom:6px;font-size:13px;}
  .open-row.overdue{border-color:var(--danger);}
  .open-row .due{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--text-dim);}
  .open-row.overdue .due{color:var(--danger);}
  .tag{display:inline-block;background:var(--tag-bg);border:1px solid #000;border-radius:2px;padding:2px 8px;font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:0.06em;color:#e8e6e1;}
  .item-list{display:flex;flex-direction:column;gap:8px;max-width:600px;margin:18px auto 0;max-height:300px;overflow-y:auto;padding-right:4px;}
  .item-row{display:flex;align-items:center;justify-content:space-between;background:var(--panel-alt);border:1px solid var(--border);border-radius:5px;padding:12px 16px;cursor:pointer;transition:border-color .15s ease;}
  .item-row:hover{border-color:var(--accent);}
  .item-row.selected{border-color:var(--accent);background:rgba(255,122,26,0.08);}
  .item-name{font-weight:600;font-size:14px;}
  .item-meta{color:var(--text-dim);font-size:12px;margin-top:2px;}
  .stock{font-family:'IBM Plex Mono',monospace;font-size:13px;}
  .stock.low{color:var(--danger);}
  .back-link{color:var(--text-dim);font-size:12px;cursor:pointer;display:inline-block;margin-bottom:14px;}
  .back-link:hover{color:var(--text);}
  .form-row{max-width:400px;margin:20px auto 0;}
  .form-row label{display:block;font-size:12px;color:var(--text-dim);margin-bottom:6px;text-transform:uppercase;letter-spacing:0.05em;}
  .form-row input,.form-row select{width:100%;background:var(--panel-alt);border:1px solid var(--border);color:var(--text);padding:10px 12px;border-radius:4px;font-family:'IBM Plex Mono',monospace;font-size:14px;margin-bottom:14px;}
  .confirm-box{text-align:center;padding:40px 0;}
  .confirm-box .icon{font-size:42px;margin-bottom:10px;}
  .confirm-box .msg{font-family:'Oswald',sans-serif;font-size:18px;text-transform:uppercase;letter-spacing:0.03em;}
  .confirm-box .detail{color:var(--text-dim);font-size:13px;margin-top:8px;}
  .report-tabs{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap;}
  table{width:100%;border-collapse:collapse;font-size:12.5px;}
  th{text-align:left;color:var(--text-dim);font-weight:500;text-transform:uppercase;letter-spacing:0.04em;font-size:10.5px;padding:8px 10px;border-bottom:1px solid var(--border);}
  td{padding:9px 10px;border-bottom:1px solid var(--border);}
  tr.overdue td{color:var(--danger);}
  .pill{font-family:'IBM Plex Mono',monospace;font-size:10.5px;padding:2px 7px;border-radius:10px;border:1px solid var(--border);}
  .pill.open{color:var(--accent);border-color:var(--accent-dim);}
  .pill.done{color:var(--success);border-color:#255c37;}
  .pill.over{color:var(--danger);border-color:#5c2527;}
  .stockbar{background:var(--panel-alt);border:1px solid var(--border);border-radius:5px;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;}
  .empty-note{color:var(--text-dim);text-align:center;padding:30px 0;font-size:13px;}
  .error-msg{color:var(--danger);font-size:12.5px;margin:-8px 0 12px;}
  .confirm-panel{max-width:420px;margin:24px auto 0;background:var(--panel-alt);border:1px solid var(--border);border-radius:6px;padding:20px;}
  .confirm-panel .q{font-size:14px;margin-bottom:16px;}
  .confirm-actions{display:flex;gap:10px;}
  .confirm-actions button{flex:1;padding:10px;border-radius:4px;border:1px solid var(--border);cursor:pointer;font-family:'Oswald',sans-serif;font-weight:600;text-transform:uppercase;font-size:13px;letter-spacing:0.03em;}
  .confirm-actions .yes{background:var(--accent);color:#1c1e22;border-color:var(--accent);}
  .confirm-actions .no{background:transparent;color:var(--text-dim);}
  .loading-wrap{display:flex;align-items:center;justify-content:center;height:100%;min-height:340px;color:var(--text-dim);font-family:'IBM Plex Mono',monospace;font-size:13px;letter-spacing:0.05em;}
  .banner-error{background:#3a1f1f;border:1px solid var(--danger);color:#f2b9b9;border-radius:5px;padding:10px 14px;font-size:12.5px;margin-bottom:16px;}
</style>
</head>
<body>

<div class="app" id="app"></div>

<script>
(function(){
  // ==== your Apps Script Web App URL ====
  const WEBAPP_URL = 'https://script.google.com/macros/s/AKfycbxk6CIrk9GI1zn82Yg-5ZI3E8WOTVG02TgYDY-yqgV6isWkDKJR-n8rnhfJZ4jSOGqLAQ/exec';

  const ICONS = { 'Tools': '🧰', 'Station Parts': '🔌' };

  const ROLES = {
    maintenance: { label: 'Maintenance', icon: '🔧', kind: 'names', names: ['Marwan','Houcem','Hamza','Ahmed','Felix','Yie Hang'] },
    management:  { label: 'Management', icon: '📋', kind: 'names', names: ['Rosa','Clarissa','Bingie'] },
    supervisor:  { label: 'Supervisor', icon: '🧭', kind: 'operatorId' },
    teleoperator:{ label: 'Tele-operator', icon: '🎮', kind: 'operatorId' }
  };

  // ==== PIN groups — change these 4-digit codes to whatever you want ====
  const GROUP_PINS = {
    groupA: '4827',     // Marwan, Houcem, Hamza, Ahmed
    groupC: '6193',     // Felix, Yie Hang
    management: '9012'  // Rosa, Clarissa, Bingie
  };
  const NAME_TO_GROUP = {
    'Marwan':'groupA', 'Houcem':'groupA', 'Hamza':'groupA', 'Ahmed':'groupA',
    'Felix':'groupC', 'Yie Hang':'groupC',
    'Rosa':'management', 'Clarissa':'management', 'Bingie':'management'
  };

  let screen = 'idle'; // idle, nameSelect, pinEntry, operatorId, menu, takeCategory, take, return, confirm, report
  let pendingRole = null;
  let pendingName = null;
  let pinError = null;
  let currentPerson = null; // {name, role, code}  code = "Name/Role"
  let takeCategory = null; // 'Tools' | 'Station Parts'
  let takeSelection = null; // {itemName, qty, hours}
  let takeSearchQuery = '';
  let takeError = null;
  let pendingReturnTx = null;
  let confirmInfo = null;
  let reportTab = 'open';
  let scanBuffer = '';
  let lastScanKeyTime = 0;
  let scanNotice = null;
  let pendingScanItem = null;
  let scanNotFoundError = null;

  let inventoryMap = {}; // itemName -> {reference, item, quantity, availability}
  let historyRows = [];  // [{timestamp, personRole, item, expectedReturn, returnedAt, txId}]
  let loadError = null;

  function esc(s){ return String(s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

  function iconForRef(reference){ return ICONS[reference] || '📦'; }
  function iconForItem(itemName){
    const inv = inventoryMap[itemName];
    return inv ? iconForRef(inv.reference) : '📦';
  }

  async function refreshRemote(){
    try{
      const res = await fetch(WEBAPP_URL, { method:'GET' });
      const data = await res.json();
      inventoryMap = {};
      (data.inventory||[]).forEach(row=>{ inventoryMap[row.item] = row; });
      historyRows = data.history || [];
      loadError = null;
    }catch(err){
      loadError = 'Could not reach the inventory sheet. Check your internet connection and try again.';
    }
  }

  async function postAction(payload){
    try{
      const res = await fetch(WEBAPP_URL, {
        method:'POST',
        headers:{ 'Content-Type':'text/plain;charset=utf-8' },
        body: JSON.stringify(payload)
      });
      return await res.json();
    }catch(err){
      return { ok:false, error:String(err) };
    }
  }

  function availableOf(itemName){
    const inv = inventoryMap[itemName];
    if(!inv) return 0;
    if(inv.reference==='Station Parts') return Number(inv.quantity)||0;
    const total = Number(inv.quantity)||0;
    const missing = historyRows.filter(h=>h.item===itemName && h.returnedAt==='Not returned').length;
    return Math.max(0, total - missing);
  }

  function openCheckoutsFor(personCode){
    return historyRows.filter(h=>{
      const inv = inventoryMap[h.item];
      return h.personRole===personCode && inv && inv.reference==='Tools' && h.returnedAt==='Not returned';
    });
  }

  function isOverdue(h){
    if(h.returnedAt !== 'Not returned') return false;
    if(!h.expectedReturn || h.expectedReturn==='None') return false;
    const t = new Date(h.expectedReturn).getTime();
    return !isNaN(t) && t < Date.now();
  }

  function fmtDate(d){
    if(!d || d==='None' || d==='Not returned') return d || '—';
    const dt = new Date(d);
    if(isNaN(dt.getTime())) return String(d);
    return dt.toLocaleDateString(undefined,{month:'short',day:'numeric'}) + ' ' + dt.toLocaleTimeString(undefined,{hour:'numeric',minute:'2-digit'});
  }

  // ---------- render shell ----------
  function render(){
    const app = document.getElementById('app');
    app.innerHTML = `
      <div class="topbar">
        <div class="brand"><h1>Supply Room</h1><span>CHECK-OUT STATION</span></div>
        <button class="nav-btn ${screen==='report'?'active':''}" id="reportBtn">${screen==='report' ? 'Close Report' : 'Manager Report'}</button>
      </div>
      <div class="stage" id="stage"></div>
    `;
    document.getElementById('reportBtn').onclick = async ()=>{
      if(screen==='report'){ screen='idle'; currentPerson=null; renderStage(); return; }
      screen = 'report';
      currentPerson = null;
      await withLoading(refreshRemote);
      renderStage();
    };
    renderStage();
  }

  function renderLoading(stage){
    stage.innerHTML = `<div class="loading-wrap">Loading…</div>`;
  }

  async function withLoading(fn){
    const stage = document.getElementById('stage');
    if(stage) renderLoading(stage);
    await fn();
  }

  function renderStage(){
    const stage = document.getElementById('stage');
    let banner = '';
    if(loadError) banner = `<div class="banner-error">${esc(loadError)}</div>`;
    if(screen==='idle') return stageRoleSelect(stage, banner);
    if(screen==='nameSelect') return stageNameSelect(stage, banner);
    if(screen==='pinEntry') return stagePinEntry(stage, banner);
    if(screen==='operatorId') return stageOperatorId(stage, banner);
    if(screen==='menu') return stageMenu(stage, banner);
    if(screen==='scanPrompt') return stageScanPrompt(stage, banner);
    if(screen==='scanConfirm') return stageScanConfirm(stage, banner);
    if(screen==='scanTakeDetail') return stageScanTakeDetail(stage, banner);
    if(screen==='takeCategory') return stageTakeCategory(stage, banner);
    if(screen==='take') return stageTake(stage, banner);
    if(screen==='return') return stageReturn(stage, banner);
    if(screen==='confirm') return stageConfirm(stage, banner);
    if(screen==='report') return stageReport(stage, banner);
  }

  // ---------- sign-in ----------
  function stageRoleSelect(stage, banner){
    stage.innerHTML = banner + `
      <div class="reader-wrap" style="padding-top:6px;">
        <div class="hint" style="margin-top:0;margin-bottom:18px;">Who's checking in?</div>
        <div class="menu-grid" style="max-width:520px;">
          ${Object.keys(ROLES).map(key=>`
            <div class="menu-card" data-role="${key}">
              <div class="big">${ROLES[key].icon}</div>
              <div class="label">${ROLES[key].label}</div>
            </div>
          `).join('')}
        </div>
      </div>
    `;
    stage.querySelectorAll('.menu-card[data-role]').forEach(card=>{
      card.onclick = ()=>{
        const key = card.getAttribute('data-role');
        pendingRole = key;
        screen = ROLES[key].kind === 'names' ? 'nameSelect' : 'operatorId';
        renderStage();
      };
    });
  }

  function stageNameSelect(stage, banner){
    const role = ROLES[pendingRole];
    stage.innerHTML = banner + `
      <span class="back-link" id="back">&larr; Back</span>
      <div class="reader-wrap" style="padding-top:6px;">
        <div class="hint" style="margin-top:0;margin-bottom:18px;">${role.icon} ${esc(role.label)} — who are you?</div>
        <div class="menu-grid" style="max-width:520px;grid-template-columns:1fr 1fr 1fr;">
          ${role.names.map(n=>`<div class="menu-card" data-name="${esc(n)}" style="padding:18px 10px;">
            <div class="label" style="font-size:13px;">${esc(n)}</div>
          </div>`).join('')}
        </div>
      </div>
    `;
    document.getElementById('back').onclick = ()=>{ pendingRole=null; screen='idle'; renderStage(); };
    stage.querySelectorAll('.menu-card[data-name]').forEach(card=>{
      card.onclick = ()=>{
        pendingName = card.getAttribute('data-name');
        pinError = null;
        screen = 'pinEntry';
        renderStage();
      };
    });
  }

  function stagePinEntry(stage, banner){
    const role = ROLES[pendingRole];
    stage.innerHTML = banner + `
      <span class="back-link" id="back">&larr; Back</span>
      <div class="reader-wrap" style="padding-top:6px;">
        <div class="hint" style="margin-top:0;">${esc(pendingName)} — enter your group PIN</div>
        <div class="slot" style="margin-top:16px;">
          <input id="pinInput" type="password" inputmode="numeric" maxlength="4" placeholder="4-DIGIT PIN" />
        </div>
        ${pinError ? `<div class="error-msg" style="margin-top:12px;">${esc(pinError)}</div>` : ''}
        <button class="go-btn" id="pinGoBtn">Sign In</button>
      </div>
    `;
    document.getElementById('back').onclick = ()=>{ pendingName=null; pinError=null; screen='nameSelect'; renderStage(); };
    const input = document.getElementById('pinInput');
    input.focus();
    const submit = async ()=>{
      const pin = input.value.trim();
      const groupKey = NAME_TO_GROUP[pendingName];
      const correctPin = GROUP_PINS[groupKey];
      if(pin !== correctPin){
        pinError = 'Incorrect PIN, try again.';
        renderStage();
        return;
      }
      currentPerson = { name: pendingName, role: role.label, code: pendingName + '/' + role.label };
      pendingName = null;
      pendingRole = null;
      pinError = null;
      screen = 'menu';
      await withLoading(refreshRemote);
      renderStage();
    };
    document.getElementById('pinGoBtn').onclick = submit;
    input.onkeydown = (e)=>{ if(e.key==='Enter') submit(); };
  }

  function stageOperatorId(stage, banner){
    const role = ROLES[pendingRole];
    stage.innerHTML = banner + `
      <span class="back-link" id="back">&larr; Back</span>
      <div class="reader-wrap" style="padding-top:6px;">
        <div class="hint" style="margin-top:0;">${role.icon} ${esc(role.label)} — enter your operator ID</div>
        <div class="slot" style="margin-top:16px;">
          <input id="opIdInput" placeholder="OPERATOR ID (numbers)" inputmode="numeric" maxlength="6" />
        </div>
        <button class="go-btn" id="opGoBtn">Sign In</button>
      </div>
    `;
    document.getElementById('back').onclick = ()=>{ pendingRole=null; screen='idle'; renderStage(); };
    const input = document.getElementById('opIdInput');
    input.focus();
    const submit = async ()=>{
      const num = input.value.trim().replace(/\D/g,'');
      if(!num) return;
      const name = 'Operator-' + num;
      currentPerson = { name, role: role.label, code: name + '/' + role.label };
      pendingRole = null;
      screen = 'menu';
      await withLoading(refreshRemote);
      renderStage();
    };
    document.getElementById('opGoBtn').onclick = submit;
    input.onkeydown = (e)=>{ if(e.key==='Enter') submit(); };
  }

  // ---------- menu ----------
  function stageMenu(stage, banner){
    const opens = openCheckoutsFor(currentPerson.code);
    const anyOpen = opens.length > 0;
    stage.innerHTML = banner + `
      <div class="greet">
        <div class="name">Hi, ${esc(currentPerson.name)}</div>
        <div class="code">${esc(currentPerson.role)}</div>
      </div>
      <div class="menu-grid">
        <div class="menu-card" id="takeCard">
          <div class="big">📦</div>
          <div class="label">Take Something</div>
          <div class="sub">Tools or Station Parts</div>
        </div>
        <div class="menu-card ${anyOpen?'':'disabled'}" id="returnCard">
          <div class="big">↩️</div>
          <div class="label">Return a Tool</div>
          <div class="sub">${anyOpen ? opens.length + ' item(s) checked out' : 'Nothing checked out'}</div>
        </div>
      </div>
      ${anyOpen ? `<div class="open-list"><h3>Currently checked out to you</h3>
        ${opens.map(h=>`
          <div class="open-row ${isOverdue(h)?'overdue':''}">
            <span>${iconForItem(h.item)} ${esc(h.item)}</span>
            <span class="due">${isOverdue(h)?'OVERDUE · ':'due '}${fmtDate(h.expectedReturn)}</span>
          </div>`).join('')}
        </div>` : ''}
      <div style="text-align:center;margin-top:22px;"><span class="back-link" id="signOut">Sign out</span></div>
    `;
    document.getElementById('takeCard').onclick = ()=>{ scanNotFoundError=null; screen='scanPrompt'; renderStage(); };
    if(anyOpen){
      document.getElementById('returnCard').onclick = ()=>{ pendingReturnTx=null; screen='return'; renderStage(); };
    }
    document.getElementById('signOut').onclick = ()=>{ currentPerson=null; screen='idle'; renderStage(); };
  }

  function stageScanPrompt(stage, banner){
    stage.innerHTML = banner + `
      <span class="back-link" id="back">&larr; Back to menu</span>
      <div class="reader-wrap" style="padding-top:6px;">
        <div class="big" style="font-size:48px;">📷</div>
        <div class="hint" style="margin-top:10px;font-size:15px;">Scan the QR code on the item</div>
        ${scanNotFoundError ? `<div class="error-msg" style="margin-top:12px;">${esc(scanNotFoundError)}</div>` : ''}
        <button id="manualBtn" style="margin-top:120px;background:transparent;color:var(--text-dim);border:1px solid var(--border);font-family:'Inter',sans-serif;font-size:11px;padding:5px 12px;border-radius:4px;cursor:pointer;">Or choose manually</button>
      </div>
    `;
    document.getElementById('back').onclick = ()=>{ scanNotFoundError=null; screen='menu'; renderStage(); };
    document.getElementById('manualBtn').onclick = ()=>{ scanNotFoundError=null; screen='takeCategory'; renderStage(); };
  }

  function stageScanConfirm(stage, banner){
    const inv = inventoryMap[pendingScanItem] || {};
    stage.innerHTML = banner + `
      <div class="confirm-box">
        <div class="icon">${iconForRef(inv.reference)}</div>
        <div class="msg">Is this correct?</div>
        <div class="detail" style="font-size:16px;color:var(--text);font-weight:600;margin-top:6px;">${esc(pendingScanItem)}</div>
        <div class="confirm-actions" style="max-width:320px;margin:24px auto 0;">
          <button class="no" id="scanNo">No, choose manually</button>
          <button class="yes" id="scanYes">Yes, this is it</button>
        </div>
      </div>
    `;
    document.getElementById('scanNo').onclick = ()=>{
      pendingScanItem = null;
      screen = 'takeCategory';
      renderStage();
    };
    document.getElementById('scanYes').onclick = ()=>{
      takeCategory = inv.reference;
      takeSelection = { itemName: pendingScanItem, qty:1, hours:24 };
      takeError = null;
      takeSearchQuery = '';
      pendingScanItem = null;
      screen = 'scanTakeDetail';
      renderStage();
    };
  }

  function stageScanTakeDetail(stage, banner){
    const itemName = takeSelection.itemName;
    stage.innerHTML = banner + `
      <span class="back-link" id="back">&larr; Scan a different item</span>
      <div class="greet" style="margin-bottom:10px;">
        <div style="font-size:40px;">${iconForRef(takeCategory)}</div>
        <div class="name" style="font-size:20px;margin-top:8px;">${esc(itemName)}</div>
        <div class="code">${takeCategory==='Tools' ? 'Checkout & return' : 'One-time use'}</div>
      </div>
      <div class="form-row">
        ${takeCategory==='Station Parts' ? `
          <label>Quantity</label>
          <input type="number" id="qtyInput" min="1" value="${takeSelection.qty}" />
        ` : `
          <label>Expected return</label>
          <select id="hoursSelect">
            <option value="4">End of day (4 hrs)</option>
            <option value="24" selected>Tomorrow (24 hrs)</option>
            <option value="72">3 days</option>
            <option value="168">1 week</option>
          </select>
        `}
        ${takeError ? `<div class="error-msg">${esc(takeError)}</div>` : ''}
        <button class="go-btn" id="confirmTake" style="width:100%;">Confirm</button>
      </div>
    `;
    document.getElementById('back').onclick = ()=>{ takeError=null; screen='scanPrompt'; renderStage(); };
    document.getElementById('confirmTake').onclick = async ()=>{
      let qty = 1;
      if(takeCategory==='Station Parts'){
        qty = parseInt(document.getElementById('qtyInput').value,10) || 1;
        const avail = availableOf(itemName);
        if(qty < 1){ takeError='Enter a quantity of at least 1.'; renderStage(); return; }
        if(qty > avail){ takeError = 'Only ' + avail + ' available right now.'; renderStage(); return; }
      }
      const hours = takeCategory==='Tools' ? parseInt(document.getElementById('hoursSelect').value,10) : null;
      takeError = null;
      document.getElementById('confirmTake').textContent = 'Saving…';
      document.getElementById('confirmTake').disabled = true;
      await submitTake(itemName, takeCategory, qty, hours, (msg)=>{ takeError=msg; renderStage(); });
    };
  }

  function stageTakeCategory(stage, banner){
    stage.innerHTML = banner + `
      <span class="back-link" id="back">&larr; Back to menu</span>
      <div class="greet" style="margin-bottom:10px;"><div class="name" style="font-size:18px;">What are you taking?</div></div>
      <div class="menu-grid">
        <div class="menu-card" id="toolsCard">
          <div class="big">🧰</div>
          <div class="label">Tools</div>
          <div class="sub">Borrow &amp; bring back</div>
        </div>
        <div class="menu-card" id="partsCard">
          <div class="big">🔌</div>
          <div class="label">Station Parts</div>
          <div class="sub">Cables, cameras, monitors &amp; more — one-time use</div>
        </div>
      </div>
    `;
    document.getElementById('back').onclick = ()=>{ screen='menu'; renderStage(); };
    document.getElementById('toolsCard').onclick = ()=>{
      takeCategory = 'Tools';
      takeSelection = {itemName:null, qty:1, hours:24};
      takeError = null;
      takeSearchQuery = '';
      screen='take'; renderStage();
    };
    document.getElementById('partsCard').onclick = ()=>{
      takeCategory = 'Station Parts';
      takeSelection = {itemName:null, qty:1, hours:24};
      takeError = null;
      takeSearchQuery = '';
      screen='take'; renderStage();
    };
  }

  // ---------- take ----------
  async function submitTake(itemName, category, qty, hours, onError){
    const payload = {
      action:'take',
      person: currentPerson.name,
      role: currentPerson.role,
      item: itemName,
      category: category,
      qty: qty,
      expectedReturn: hours ? new Date(Date.now() + hours*3600*1000).toISOString() : null
    };
    const result = await postAction(payload);
    if(!result.ok){
      onError('Something went wrong saving this — check your connection and try again.');
      return;
    }
    await refreshRemote();
    confirmInfo = {
      icon: category==='Tools' ? '🧰' : '✅',
      msg: category==='Tools' ? 'Checked out' : 'Taken from inventory',
      detail: `${iconForRef(category)} ${qty} × ${itemName}` + (payload.expectedReturn ? ` — return by ${fmtDate(payload.expectedReturn)}` : ' — logged as used, no return needed')
    };
    screen='confirm';
    renderStage();
  }

  function stageTake(stage, banner){
    const selected = takeSelection.itemName;
    const allItems = Object.values(inventoryMap).filter(it=>it.reference===takeCategory);
    const q = takeSearchQuery.trim().toLowerCase();
    const items = q ? allItems.filter(it=>it.item.toLowerCase().includes(q)) : allItems;
    let scanBanner = '';
    if(scanNotice){
      scanBanner = `<div class="banner-error" style="background:#1f3a24;border-color:var(--success);color:#bdf2c9;">📷 Scanned: ${esc(scanNotice)}</div>`;
      scanNotice = null;
    }
    stage.innerHTML = banner + scanBanner + `
      <span class="back-link" id="back">&larr; Back</span>
      <div class="greet" style="margin-bottom:10px;"><div class="name" style="font-size:18px;">${takeCategory==='Tools' ? 'Which tool?' : 'Which part?'}</div></div>
      <div class="form-row" style="margin-top:0;margin-bottom:14px;">
        <input type="text" id="searchInput" placeholder="Search ${takeCategory==='Tools' ? 'tools' : 'parts'}…" style="font-family:'Inter',sans-serif;letter-spacing:normal;margin-bottom:0;" value="${esc(takeSearchQuery)}" />
      </div>
      <div class="item-list">
        ${items.length ? items.map(it=>{
          const avail = availableOf(it.item);
          const low = it.reference==='Station Parts' && Number(it.quantity) <= 3;
          return `<div class="item-row ${selected===it.item?'selected':''}" data-name="${esc(it.item)}">
            <div>
              <span class="tag">${iconForRef(it.reference)}</span>
              <div class="item-name" style="margin-top:5px;">${esc(it.item)}</div>
              <div class="item-meta">${it.reference==='Tools' ? 'Checkout &amp; return' : 'One-time use'}</div>
            </div>
            <div class="stock ${low?'low':''}">${avail} avail</div>
          </div>`;
        }).join('') : `<div class="empty-note">${allItems.length ? 'No items match your search.' : 'No items found in this category yet.'}</div>`}
      </div>
      <div class="form-row" id="detailsForm" style="display:${selected?'block':'none'}">
        ${takeCategory==='Station Parts' ? `
          <label>Quantity</label>
          <input type="number" id="qtyInput" min="1" value="${takeSelection.qty}" />
        ` : `
          <label>Expected return</label>
          <select id="hoursSelect">
            <option value="4">End of day (4 hrs)</option>
            <option value="24" selected>Tomorrow (24 hrs)</option>
            <option value="72">3 days</option>
            <option value="168">1 week</option>
          </select>
        `}
        ${takeError ? `<div class="error-msg">${esc(takeError)}</div>` : ''}
        <button class="go-btn" id="confirmTake" style="width:100%;">Confirm</button>
      </div>
    `;
    document.getElementById('back').onclick = ()=>{ takeError=null; screen='takeCategory'; renderStage(); };
    const searchInput = document.getElementById('searchInput');
    searchInput.oninput = ()=>{
      takeSearchQuery = searchInput.value;
      renderStage();
      setTimeout(()=>{
        const el = document.getElementById('searchInput');
        if(el){ el.focus(); const v = el.value; el.value=''; el.value=v; }
      },0);
    };
    stage.querySelectorAll('.item-row').forEach(row=>{
      row.onclick = ()=>{
        takeSelection.itemName = row.getAttribute('data-name');
        takeError = null;
        renderStage();
        setTimeout(()=>{
          const el = document.getElementById(takeCategory==='Station Parts' ? 'qtyInput' : 'hoursSelect');
          if(el) el.focus();
        },0);
      };
    });
    if(selected){
      document.getElementById('confirmTake').onclick = async ()=>{
        let qty = 1;
        if(takeCategory==='Station Parts'){
          qty = parseInt(document.getElementById('qtyInput').value,10) || 1;
          const avail = availableOf(selected);
          if(qty < 1){ takeError='Enter a quantity of at least 1.'; renderStage(); return; }
          if(qty > avail){ takeError = 'Only ' + avail + ' available right now.'; renderStage(); return; }
        }
        const hours = takeCategory==='Tools' ? parseInt(document.getElementById('hoursSelect').value,10) : null;
        takeError = null;
        document.getElementById('confirmTake').textContent = 'Saving…';
        document.getElementById('confirmTake').disabled = true;
        await submitTake(selected, takeCategory, qty, hours, (msg)=>{ takeError=msg; renderStage(); });
      };
    }
  }

  // ---------- return ----------
  function stageReturn(stage, banner){
    const opens = openCheckoutsFor(currentPerson.code);
    const pendingTx = pendingReturnTx ? opens.find(h=>h.txId===pendingReturnTx) : null;
    stage.innerHTML = banner + `
      <span class="back-link" id="back">&larr; Back to menu</span>
      <div class="greet" style="margin-bottom:10px;"><div class="name" style="font-size:18px;">What are you returning?</div></div>
      <div class="item-list">
        ${opens.map(h=>`
          <div class="item-row ${pendingReturnTx===h.txId?'selected':''}" data-tx="${h.txId}">
            <div>
              <div class="item-name" style="margin-top:5px;">${iconForItem(h.item)} ${esc(h.item)}</div>
              <div class="item-meta">taken ${fmtDate(h.timestamp)}</div>
            </div>
            <div class="stock ${isOverdue(h)?'low':''}">${isOverdue(h)?'OVERDUE':('due '+fmtDate(h.expectedReturn))}</div>
          </div>`).join('')}
      </div>
      ${pendingTx ? `
        <div class="confirm-panel">
          <div class="q">Confirm you're returning <strong>${iconForItem(pendingTx.item)} ${esc(pendingTx.item)}</strong>?</div>
          <div class="confirm-actions">
            <button class="no" id="cancelReturn">Cancel</button>
            <button class="yes" id="okReturn">Yes, returned</button>
          </div>
        </div>
      ` : ''}
    `;
    document.getElementById('back').onclick = ()=>{ pendingReturnTx=null; screen='menu'; renderStage(); };
    stage.querySelectorAll('.item-row').forEach(row=>{
      row.onclick = ()=>{ pendingReturnTx = row.getAttribute('data-tx'); renderStage(); };
    });
    if(pendingTx){
      document.getElementById('cancelReturn').onclick = ()=>{ pendingReturnTx=null; renderStage(); };
      document.getElementById('okReturn').onclick = async ()=>{
        document.getElementById('okReturn').textContent = 'Saving…';
        document.getElementById('okReturn').disabled = true;
        const result = await postAction({ action:'return', txId: pendingTx.txId, item: pendingTx.item });
        if(!result.ok){
          pendingReturnTx=null;
          loadError = 'Could not save the return — check your connection and try again.';
          renderStage();
          return;
        }
        await refreshRemote();
        pendingReturnTx = null;
        confirmInfo = { icon:'✅', msg:'Returned', detail: `${iconForItem(pendingTx.item)} ${pendingTx.item} is back in the supply room` };
        screen='confirm';
        renderStage();
      };
    }
  }

  function stageConfirm(stage, banner){
    stage.innerHTML = banner + `
      <div class="confirm-box">
        <div class="icon">${confirmInfo.icon}</div>
        <div class="msg">${esc(confirmInfo.msg)}</div>
        <div class="detail">${esc(confirmInfo.detail)}</div>
        <button class="go-btn" id="doneBtn" style="margin-top:26px;">Done</button>
      </div>
    `;
    document.getElementById('doneBtn').onclick = ()=>{ currentPerson=null; screen='idle'; renderStage(); };
    setTimeout(()=>{ if(screen==='confirm'){ currentPerson=null; screen='idle'; renderStage(); } }, 6000);
  }

  // ---------- manager report ----------
  function stageReport(stage, banner){
    const toolItems = Object.values(inventoryMap).filter(it=>it.reference==='Tools');
    const partItems = Object.values(inventoryMap).filter(it=>it.reference==='Station Parts');
    const openTx = historyRows.filter(h=>{
      const inv = inventoryMap[h.item];
      return inv && inv.reference==='Tools' && h.returnedAt==='Not returned';
    });
    const overdueTx = openTx.filter(isOverdue);
    const allTx = [...historyRows].sort((a,b)=> new Date(b.timestamp)-new Date(a.timestamp));

    let rows = [];
    if(reportTab==='open') rows = openTx;
    else if(reportTab==='overdue') rows = overdueTx;
    else if(reportTab==='all') rows = allTx;

    stage.innerHTML = banner + `
      <div class="report-tabs">
        <button class="nav-btn ${reportTab==='open'?'active':''}" data-t="open">Open (${openTx.length})</button>
        <button class="nav-btn ${reportTab==='overdue'?'active':''}" data-t="overdue">Overdue (${overdueTx.length})</button>
        <button class="nav-btn ${reportTab==='all'?'active':''}" data-t="all">Full History</button>
        <button class="nav-btn ${reportTab==='stock'?'active':''}" data-t="stock">Inventory Status</button>
      </div>
      ${reportTab==='stock' ? `
        <div>
          <div style="font-family:'Oswald',sans-serif;font-size:12px;text-transform:uppercase;letter-spacing:0.05em;color:var(--text-dim);margin:0 0 8px;">Tools</div>
          ${toolItems.length ? toolItems.map(it=>`<div class="stockbar">
              <span>${iconForRef('Tools')} ${esc(it.item)}</span>
              <span class="stock ${String(it.availability||'').includes('missing')?'low':''}">${esc(it.availability||'—')}</span>
            </div>`).join('') : `<div class="empty-note">No tools yet.</div>`}
          <div style="font-family:'Oswald',sans-serif;font-size:12px;text-transform:uppercase;letter-spacing:0.05em;color:var(--text-dim);margin:18px 0 8px;">Station Parts</div>
          ${partItems.length ? partItems.map(it=>{
            const low = Number(it.quantity) <= 3;
            return `<div class="stockbar">
              <span>${iconForRef('Station Parts')} ${esc(it.item)}</span>
              <span class="stock ${low?'low':''}">${it.quantity!=null?it.quantity:'—'} left ${it.availability==='X'?'— OUT':''}</span>
            </div>`;
          }).join('') : `<div class="empty-note">No station parts yet.</div>`}
        </div>
      ` : `
        ${rows.length ? `
        <table>
          <thead><tr><th>Person/Role</th><th>Item</th><th>Taken</th><th>Expected</th><th>Returned</th></tr></thead>
          <tbody>
            ${rows.map(h=>`
              <tr class="${isOverdue(h) ? 'overdue':''}">
                <td>${esc(h.personRole)}</td>
                <td>${iconForItem(h.item)} ${esc(h.item)}</td>
                <td>${fmtDate(h.timestamp)}</td>
                <td>${fmtDate(h.expectedReturn)}</td>
                <td>${h.returnedAt==='Not returned' ? (isOverdue(h) ? '<span class="pill over">overdue</span>' : '<span class="pill open">out</span>') : '<span class="pill done">'+fmtDate(h.returnedAt)+'</span>'}</td>
              </tr>`).join('')}
          </tbody>
        </table>` : `<div class="empty-note">Nothing here yet.</div>`}
      `}
    `;
    stage.querySelectorAll('.report-tabs button').forEach(b=>{
      b.onclick = ()=>{ reportTab = b.getAttribute('data-t'); renderStage(); };
    });
  }

  // ---------- barcode/QR scanner support ----------
  // The Inateck BCST-23 (and most handheld scanners) acts like a keyboard:
  // it "types" the encoded text very fast, then presses Enter. We detect that
  // speed pattern to tell a scan apart from normal human typing, and jump
  // straight to that item once a match is found in the current inventory.
  const SCAN_MAX_GAP_MS = 300;

  function normalizeText(s){
    return String(s).trim().toLowerCase().replace(/\s+/g, ' ');
  }

  function tryHandleScan(text){
    if(!currentPerson) return; // must be signed in first
    if(screen !== 'scanPrompt') return; // only accept scans while on the scan screen
    const trimmed = text.trim();
    const norm = normalizeText(trimmed);
    let matchName = Object.keys(inventoryMap).find(name => normalizeText(name) === norm);
    if(!matchName){
      matchName = Object.keys(inventoryMap).find(name => {
        const n = normalizeText(name);
        return norm.includes(n) || n.includes(norm);
      });
    }
    if(!matchName){
      scanNotFoundError = `No matching item found for scan: "${trimmed}". (${Object.keys(inventoryMap).length} items loaded) Try again, or choose manually.`;
      renderStage();
      return;
    }
    scanNotFoundError = null;
    pendingScanItem = matchName;
    screen = 'scanConfirm';
    renderStage();
  }

  document.addEventListener('keydown', function(e){
    const now = Date.now();
    if(now - lastScanKeyTime > SCAN_MAX_GAP_MS){
      scanBuffer = '';
    }
    lastScanKeyTime = now;

    if(e.key === 'Enter'){
      const candidate = scanBuffer;
      scanBuffer = '';
      if(candidate.length >= 2) tryHandleScan(candidate);
    }else if(e.key.length === 1){
      scanBuffer += e.key;
    }
  }, true);

  (async function init(){
    render();
    renderLoading(document.getElementById('stage'));
    await refreshRemote();
    renderStage();
  })();
})();
</script>
