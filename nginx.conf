server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Prefer the app, never show a directory listing
    autoindex off;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets lightly on the LAN
    location /images/ {
        expires 1h;
        add_header Cache-Control "public";
    }

    location /src/ {
        expires 5m;
        add_header Cache-Control "public";
    }
}
